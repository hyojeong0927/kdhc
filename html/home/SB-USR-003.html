<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/x-icon">
    <!-- css -->
    <link rel="stylesheet" href="../../css/index.css">
    <!-- script -->
    <script src="../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../assets/js/common.js"></script>
    <script type="module" src="../../assets/js/components/login.js"></script>
</head>

<body>
    <div class="kdhc-login-wrap">

        <!-- 본문 바로가기 영역 -->
        <div id="kdhc-skip-link">
            <a href="#logins">로그인 바로가기</a>
        </div>
        <!--// 본문 바로가기 영역  -->
        
        <!-- 페이지 타이틀 -->
        <div class="login-page-title">
            <h2 class="title">Log in</h2>
        </div>
        <!--// 페이지 타이틀 -->
        
        <!-- 컨테이너 영역 -->
        <section id="logins" class="kdhc-login-container">
            <div class="inner">
                <div class="login-box">
                    <article class="login-header">
                        <h1 class="login-logo">
                            <i class="icon login-logo"></i>
                            <span class="brand-name" aria-label="제어망 스마트 보안관리 플랫폼">제어망 스마트 보안관리 플랫폼</span>
                        </h1>
                    </article>
                    <article class="login-content">
                        <form>
                            <fieldset>
                                <div class="form-row">
                                    <div class="form-id-group">
                                        <label for="login-id" class="login-id-label">사번 입력</label>
                                        <input type="text" value="" id="login-id" class="form-control" data-label="login-id-label" aria-label="사번 입력 난" />
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-pw-group">
                                        <label for="login-pw" class="login-pw-label">비밀번호 입력</label>
                                        <input type="password" value="" id="login-pw" class="form-control" data-label="login-pw-label" aria-label="비밀번호 입력 난" />
                                    </div>
                                </div>
                                <div class="form-btn">
                                    <button type="button" class="login-btn" aria-label="로그인 버튼">로그인</button>
                                </div>
                                <div class="form-hint-invalid"></div>
                            </fieldset>
                        </form>
                    </article>
                    
                </div>
            </div>
        </section>
        <!--// 컨테이너 영역 -->

    </div>

    <!-- script wrap -->
    <script>
        const loginId = document.querySelector("#login-id");
        const loginPw = document.querySelector("#login-pw");
        const loginButton = document.querySelector(".login-content button");
        const loginErrorMsg = document.querySelector(".form-hint-invalid");

        loginButton.addEventListener("click", (event) => {
            event.preventDefault();

            const id = loginId.value.trim();
            const pw = loginPw.value.trim();

            console.log("hello", id);

            if(id ==="4100415" && pw === "123456") {
                window.location.href = "SB-USR-003_02.html";
                
            } else if (id === "4100415" && pw === "********") {
                window.location.href = "SB-USR-001.html";

            } else if (id === "admin" && pw === "********") {
                window.location.href = "SB-USR-002.html";

            } else  {
                loginErrorMsg.style.display = "block";
                loginErrorMsg.textContent = "아이디 또는 비밀번호가 틀렸습니다.";
            }
            loginId.addEventListener("input", () => loginErrorMsg.style.display = "none");
            loginPw.addEventListener("input", () => loginErrorMsg.style.display = "none");
        });
    </script>
    <!--// script wrap -->

    <!-- modal wrap -->
    <!--// modal wrap -->
</body>

</html>
