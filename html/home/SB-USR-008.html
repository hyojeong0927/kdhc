                    stepListHtml += '</ul>';
                    return `<div class="step step-sm">${stepListHtml}</div>`;
                }

            }
        ];
        let sampleGridApi;

        const sampleGridOptions = {
            defaultColDef: {
                editable: false, // edit 사용 유무
                autoHeight: true,
                sortable: true, // sort 사용 유무
            },
            columnDefs,
            headerHeight: 41, // header height
            rowData: rowData,
            rowHeight: 63, // row height
            rowSelection: { // row checkbox
                mode: "multiRow",
                groupSelects: "descendants",
                selectAll: 'filtered',
                width: 52,
            },
            domLayout: "autoHeight", // grid 스크롤 없이 auto height 옵션
            suppressColumnVirtualisation: true, // grid 스크롤 없이 auto height 옵션
            // data empty style
            overlayNoRowsTemplate: '<div class="empty"><div class="empty-img"></div><div class="empty-txt">데이타가 없습니다.</div></div>',
        };
        const sampleGridDiv = document.querySelector("#sampleGrid");
        sampleGridApi = agGrid.createGrid(sampleGridDiv, sampleGridOptions);
    </script>
