<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <!-- css -->
    <link rel="stylesheet" href="../../css/index.css">
    <!-- script -->
    <script src="../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../assets/js/common.js"></script>
    <script type="module" src="../../assets/js/components/login.js"></script>
</head>

<body>
    <div class="kdhc-login-wrap">

        <!-- 본문 바로가기 영역 -->
        <div id="kdhc-skip-link">
            <a href="#logins">로그인 바로가기</a>
        </div>
        <!--// 본문 바로가기 영역  -->
        
        <!-- 페이지 타이틀 -->
        <div class="login-page-title">
            <h2 class="title">비밀번호 변경 </h2>
        </div>
        <!--// 페이지 타이틀 -->
        
        <!-- 컨테이너 영역 -->
        <section id="logins" class="kdhc-login-container">
            <div class="inner">
                <div class="login-box">
                    <article class="login-header">
                        <h1 class="login-logo">
                            <i class="icon login-logo"></i>
                            <span class="brand-name" aria-label="제어망 스마트 보안관리 플랫폼">제어망 스마트 보안관리 플랫폼</span>
                        </h1>
                    </article>
                    <!-- no-icon 추가 -->
                    <article class="login-content no-icon">
                        <form>
                            <fieldset>
                                <div class="form-row">
                                    <div class="form-id-group">
                                        <label for="login-id" class="login-id-label">사번</label>
                                        <input type="text" id="login-id" class="form-control" data-label="login-id-label" aria-label="사번" />
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-pw-group">
                                        <label for="login-pw" class="login-pw-label">현재 비밀번호</label>
                                        <input type="password" id="login-pw" class="form-control" data-label="login-pw-label" aria-label="현재 비밀번호" />
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-pw-group">
                                        <label for="login-pw-new" class="login-pw-label login-pw-new-label">새로운 비밀번호</label>
                                        <input type="password" id="login-pw-new" class="form-control" data-label="login-pw-new-label" aria-label="새로운 비밀번호" />
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-pw-group">
                                        <label for="login-pw-ok" class="login-pw-label login-pw-ok-label">새로운 비밀번호 확인</label>
                                        <input type="password" id="login-pw-ok" class="form-control" data-label="login-pw-ok-label" aria-label="새로운 비밀번호 확인" />
                                    </div>
                                </div>
                                <div class="form-btn">
                                    <button type="button" class="login-btn" aria-label="비밀번호 변경 버튼">비밀번호 변경</button>
                                </div>
                            </fieldset>
                        </form>
                    </article>
                </div>
            </div>
        </section>
        <!--// 컨테이너 영역 -->

    </div>

    <!-- script wrap -->
    <!--// script wrap -->

    <!-- modal wrap -->
    <!--// modal wrap -->
</body>

</html>
