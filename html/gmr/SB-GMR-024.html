<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <!-- css -->
    <link rel="stylesheet" href="../../css/index.css">
    <!-- script -->
    <script src="../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../assets/js/common.js"></script>
</head>
<body>
    <div id="wrap" class="kdhc-wrap">

        <!-- 본문 바로가기 영역 -->
        <div id="kdhc-skip-link">
            <a href="#contents">본문 바로가기</a>
        </div>
        <!--// 본문 바로가기 영역  -->

        <!-- 상단 배너영역 -->
        <div id="kdhc-masthead">
            <div class="toggle-wrap">
                <div class="toggle-head">
                    <div class="inner">
                        <span class="nuri-txt">이 누리집은 한국지역난방공사 제어망 스마트 보안관리 플랫폼 누리집입니다.</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- // 상단 배너영역 -->

        <!-- 헤더 영역 -->
       <header id="kdhc-header" data-menu='[
            { "title": "관리보안", "url": "#" },
            { "title": "물리보안", "url": "#" },
            { "title": "기술보안", "url": "#" },
            { "title": "보안정책", "url": "#" },
            { "title": "클린PC", "url": "#" }
            { "title": "정보자산", "url": "#" }
            { "title": "관리자", "url": "#", "active": true }]'>
            <script type="module" src="../../assets/js/layouts/header.js"></script>
        </header>
        <!--// 헤더 영역 -->

        <!-- 컨테이너 영역 -->
        <section id="kdhc-container">
            <div class="inner">
                <!-- 사이드 영역 -->
                <script type="module" src="../../assets/js/layouts/sidebar.js"></script>
                <aside id="sidebar" class="sidebar" data-menu='[
                        { "name": "공지사항 관리", "url": "#" },
                        { "name": "보고서 일정 관리", "url": "#" },
                        { "name": "지침 및 매뉴얼 관리", "url": "#" },
                        { "name": "메뉴 관리", "url": "#" },
                        { "name": "권한별 메뉴 관리", "url": "#" },
                        { "name": "페이지 관리", "url": "#" },
                        { "name": "사용자 관리", "url": "#" },
                        { "name": "공통코드 관리", "url": "#", "active": true },
                        { "name": "인사이동 관리", "url": "#" },
                        { "name": "USB 저장매체 사용현황", "url": "#" },
                        { "name": "스티커 이용내역", "url": "#" }
                        ]'></aside>
                <!--// 사이드 영역 -->

                <main class="main-contents">
                    <!-- breadcrumbs start : 현재 히든 처리 추후 변경 가능 -->
                    <nav id="breadcrumb" class="breadcrumb-wrap" aria-label="breadcrumb" 
                        data-breadcrumb='[
                            { "name": "관리자", "url": "#" },
                            { "name": "공통코드 관리", "url": "", "active": true }
                        ]'
                        data-visible="false">
                    </nav> 
                    <!--// breadcrumbs end -->
                    
                <!-- 컨텐츠 영역 -->
                    <div id="contents" class="contents">

                        <!-- page title start -->
                        <div class="page-title-wrap" 
                            data-title="공통코드 관리" 
                            data-badge=""
                            data-badge-visible="false">
                        </div>
                        <!--// page title end -->
                        <button type="button" id="medium-btn" class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
                            공통코드 수정 팝업
                        </button>
                    </div>
                    <!--// 컨텐츠 영역 -->

                </main>

            </div>
        </section>
        <!--// 컨테이너 영역 -->

        <!-- 푸터 영역 -->
        <footer id="kdhc-footer">
            <script type="module" src="../../assets/js/layouts/footer.js"></script>
        </footer>
        <!--// 푸터 영역 -->
 
    </div>
    <!-- script wrap -->
    <!--// script wrap -->
    
    <!-- modal wrap -->
     <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog md">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title" id="staticBackdropLabel">서브코드 팝업</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="inner">
                        <!-- content start -->

                        <!-- grid wrap start -->
                        <article class="grid-wrap">
                            <div id="sampleGrid" class="normal" style="width: 100%; height: 94px;"></div>
                        </article>
                        <!--// grid wrap end -->

                        <!--// content start -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline btn-md" data-bs-dismiss="modal">추가</button>
                    <button type="button" class="btn btn-primary btn-md">저장</button>
                </div>
            </div>
        </div>
    </div>
    <!--// modal wrap -->
    <!-- script wrap -->
    <script type="module">
        const rowData = [
            {
                field01: "관리자",
                field02: "",
                field03: "페이지 명",
                field04: "홍길동",
                field05: "",
            },
        ];
        const columnDefs = [
            {
                headerName: "그룹코드",
                headerClass: "center",
                field: "field01",
                width: 160,
                cellClass: "cell-normal",
            },
            {
                headerName: "정렬순서",
                headerClass: "center",
                field: "field02",
                width: 80,
                cellClass: "cell-normal",
            },
            {
                headerName: "코드",
                headerClass: "center",
                field: "field03",
                width: 160,
                cellClass: "cell-normal",
            },
            {
                headerName: "코드명",
                headerClass: "center",
                field: "field04",
                minWidth: 230,
                flex: 1,
                cellClass: "cell-normal",
            },
            {
                headerName: "삭제",
                headerClass: "center",
                field: "field05",
                width: 112,
                cellClass: "cell-normal",
                cellRenderer: params => {
                    return '<button type="button" class="btn btn-icon"><i class="icon del-trash" /></button>';
                }
            }
        ];
        let sampleGridApi;

        const sampleGridOptions = {
            defaultColDef: {
                editable: false, // edit 사용 유무
                autoHeight: true,
                sortable: true, // sort 사용 유무
            },
            columnDefs,
            headerHeight: 41, // header height
            rowData: rowData,
            rowHeight: 40, // row height

            // data empty style
            overlayNoRowsTemplate: '<div class="empty"><div class="empty-img"></div><div class="empty-txt">데이타가 없습니다.</div></div>',
        };
        const sampleGridDiv = document.querySelector("#sampleGrid");
        sampleGridApi = agGrid.createGrid(sampleGridDiv, sampleGridOptions);
    </script>
    <!--// script wrap -->
</body>
</html>
