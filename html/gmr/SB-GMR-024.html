<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/x-icon">
    <!-- css -->
    <link rel="stylesheet" href="../../css/index.css">
    <!-- script -->
    <script src="../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../assets/js/common.js"></script>
</head>
<body>
    <div id="wrap" class="kdhc-wrap">

        <!-- 본문 바로가기 영역 -->
        <div id="kdhc-skip-link">
            <a href="#contents">본문 바로가기</a>
        </div>
        <!--// 본문 바로가기 영역  -->

        <!-- 상단 배너영역 -->
        <div id="kdhc-masthead">
            <script type="module" src="../../assets/js/layouts/top-banner.js"></script>
        </div>
        <!-- // 상단 배너영역 -->

        <!-- 헤더 영역 -->
        <header id="kdhc-header" data-menu='[
            { "title": "관리보안", "url": "#" },
            { "title": "물리보안", "url": "#" },
            { "title": "기술보안", "url": "#" },
            { "title": "보안정책", "url": "#" },
            { "title": "클린PC", "url": "#" },
            { "title": "정보자산", "url": "#" },
            { "title": "관리자", "url": "#", "active": true }]'>
            <script type="module" src="../../assets/js/layouts/header.js"></script>
        </header>
        <!--// 헤더 영역 -->

        <!-- 컨테이너 영역 -->
        <section id="kdhc-container">
            <div class="inner">
                <!-- 사이드 영역 -->
                <script type="module" src="../../assets/js/layouts/sidebar.js"></script>
                <aside id="sidebar" class="sidebar" data-menu='[
                        { "name": "공지사항 관리", "url": "#" },
                        { "name": "정기점검 관리", "url": "#" },
                        { "name": "일반점검 관리", "url": "#" },
                        { "name": "지침 및 매뉴얼 관리", "url": "#" },
                        { "name": "메뉴 관리", "url": "#" },
                        { "name": "권한별 메뉴 관리", "url": "#" },
                        { "name": "페이지 관리", "url": "#" },
                        { "name": "사용자 관리", "url": "#" },
                        { "name": "공통코드 관리", "url": "#", "active": true },
                        { "name": "인사이동 관리", "url": "#" },
                        { "name": "USB 저장매체 사용현황", "url": "#" },
                        { "name": "스티커 이용내역", "url": "#" }
                        ]'></aside>
                <!--// 사이드 영역 -->

                <main class="main-contents">
                    <!-- breadcrumbs start : 현재 히든 처리 추후 변경 가능 -->
                    <nav id="breadcrumb" class="breadcrumb-wrap" aria-label="breadcrumb" 
                        data-breadcrumb='[
                            { "name": "관리자", "url": "#" },
                            { "name": "공통코드 관리", "url": "", "active": true }
                        ]'
                        data-visible="false">
                    </nav> 
                    <!--// breadcrumbs end -->
                    
                    <!-- 컨텐츠 영역 -->
                    <div id="contents" class="contents">

                        <!-- page title start -->
                        <div class="page-title-wrap" 
                            data-title="공통코드 관리" 
                            data-badge=""
                            data-badge-visible="false">
                        </div>
                        <!--// page title end -->
                        <!-- 팝업 호출 버튼 -->
                        <button type="button" id="popup-btn" class="btn btn-primary btn-lg">
                            서브코드 팝업
                        </button>
                        <!--// 팝업 호출 버튼 -->

                        <!-- popup script -->
                         <script type="module">
                            import { openCenteredPopup } from '../../assets/js/components/popup.js';

                            document.addEventListener('DOMContentLoaded', () => {
                                document.getElementById('popup-btn').addEventListener('click', () => {
                                    const url = './popup/SB-GMR-024.html';
                                    openCenteredPopup(url, 800, 400);
                                });
                            });
                        </script>
                        <!--// popup script -->
                    </div>
                    <!--// 컨텐츠 영역 -->

                </main>
            </div>
        </section>
        <!--// 컨테이너 영역 -->

        <!-- 푸터 영역 -->
        <footer id="kdhc-footer">
            <script type="module" src="../../assets/js/layouts/footer.js"></script>
        </footer>
        <!--// 푸터 영역 -->
 
    </div>    
</body>
</html>
