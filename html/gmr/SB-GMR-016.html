<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <!-- css -->
    <link rel="stylesheet" href="../../css/index.css">
    <!-- script -->
    <script src="../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../assets/js/common.js"></script>
</head>
<body>
    <div id="wrap" class="kdhc-wrap">

        <!-- 본문 바로가기 영역 -->
        <div id="kdhc-skip-link">
            <a href="#contents">본문 바로가기</a>
        </div>
        <!--// 본문 바로가기 영역  -->

        <!-- 상단 배너영역 -->
        <div id="kdhc-masthead">
            <div class="toggle-wrap">
                <div class="toggle-head">
                    <div class="inner">
                        <span class="nuri-txt">이 누리집은 한국지역난방공사 제어망 스마트 보안관리 플랫폼 누리집입니다.</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- // 상단 배너영역 -->

        <!-- 헤더 영역 -->
        <header id="kdhc-header" data-menu='[
            { "title": "관리보안", "url": "#" },
            { "title": "물리보안", "url": "#" },
            { "title": "기술보안", "url": "#" },
            { "title": "보안정책", "url": "#" },
            { "title": "클린PC", "url": "#" },
            { "title": "정보자산", "url": "#" },
            { "title": "관리자", "url": "#", "active": true }]'>
            <script type="module" src="../../assets/js/layouts/header.js"></script>
        </header>
        <!--// 헤더 영역 -->

        <!-- 컨테이너 영역 -->
        <section id="kdhc-container">
            <div class="inner">
                <!-- 사이드 영역 -->
                <script type="module" src="../../assets/js/layouts/sidebar.js"></script>
                <aside id="sidebar" class="sidebar" data-menu='[
                        { "name": "공지사항 관리", "url": "#" },
                        { "name": "보고서 일정 관리", "url": "#" },
                        { "name": "지침 및 매뉴얼 관리", "url": "#" },
                        { "name": "메뉴 관리", "url": "#" },
                        { "name": "권한별 메뉴 관리", "url": "#" },
                        { "name": "페이지 관리", "url": "#", "active": true },
                        { "name": "사용자 관리", "url": "#" },
                        { "name": "공통코드 관리", "url": "#" },
                        { "name": "인사이동 관리", "url": "#" },
                        { "name": "USB 저장매체 사용현황", "url": "#" },
                        { "name": "스티커 이용내역", "url": "#" }
                        ]'></aside>
                <!--// 사이드 영역 -->

                <main class="main-contents">
                    <!-- breadcrumbs start : 현재 히든 처리 추후 변경 가능 -->
                    <nav id="breadcrumb" class="breadcrumb-wrap" aria-label="breadcrumb" 
                        data-breadcrumb='[
                            { "name": "관리자", "url": "#" },
                            { "name": "페이지 관리", "url": "", "active": true }
                        ]'
                        data-visible="false">
                    </nav> 
                    <!--// breadcrumbs end -->
                    
                <!-- 컨텐츠 영역 -->
                    <div id="contents" class="contents">

                        <!-- page title start -->
                        <div class="page-title-wrap" 
                            data-title="페이지 관리" 
                            data-badge=""
                            data-badge-visible="false">
                        </div>
                        <!--// page title end -->

                        <!-- search start-->
                        <article class="search-form-area">
                            <!-- form start -->
                            <form>
                                <fieldset>

                                    <!-- form-wrap start -->
                                    <div class="form-wrap type02">
                                        <!-- row -->
                                        <div class="form-row">
                                            <!-- col -->
                                            <div class="col">
                                                <div class="form-label">메뉴</div>
                                                <div class="form-group">
                                                    <!-- form select group-->
                                                    <!-- error : select-group is-error 추가가 -->
                                                    <div class="select-group">
                                                        <select class="form-select" aria-label="Default select" required>
                                                            <option value="">선택하세요</option>
                                                            <option value="1" selected>전체</option>
                                                            <option value="2">Two</option>
                                                            <option value="3">Three</option>
                                                        </select>
                                                    </div>
                                                    <!-- 에러 문구 -->
                                                    <!-- error : hidden 삭제 -->
                                                    <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                    <!--// 에러 문구 -->
                                                </div>
                                            </div>
                                            <!-- col -->
                                            <div class="col">
                                                <div class="form-label">페이지 명</div>
                                                <div class="form-group">
                                                    <!-- input group -->
                                                    <div class="input-group">
                                                        <input type="text" id="input-text" class="form-control" placeholder="페이지 명 입력" value="">
                                                        <label for="input-text" class="hidden">페이지 명</label>
                                                    </div>
                                                    <!--// input group -->
                                                    <!-- 에러 문구 -->
                                                    <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                    <!--// 에러 문구 -->
                                                </div>
                                            </div>
                                            <!--//  -->
                                        </div>
                                        <!-- row -->
                                        <div class="form-row search-btn">
                                            <button type="button" class="btn btn-primary lg">조회</button>
                                        </div>
                                        <!--// row end -->
                                    </div>
                                    <!--// form-wrap end -->

                                </fieldset>
                            </form>
                            <!--// form end -->
                        </article>
                        <!--// search end-->

                        <!-- grid top start -->
                        <article class="grid-top-area">
                            <!-- grid top left start -->
                            <div class="grid-top-left">
                               <select class="form-select sm" aria-label="Default select" required>
                                <option value="">선택하세요</option>
                                <option value="10" selected>10개씩 보기</option>
                                <option value="20">20개씩 보기</option>
                                <option value="30">30개씩 보기</option>
                            </select>
                            </div>
                            <!--// grid top left end -->

                            <!-- grid top button start -->
                            <div class="grid-top-btn" 
                                data-buttons='[{"text": "추가"}]'>
                            </div>
                            <!--// grid top button end -->
                        </article>
                        <!--// grid top end -->

                        <!-- grid wrap start -->
                        <article class="grid-wrap">
                            <div id="sampleGrid" class="normal admin" style="width: 100%;"></div>
                        </article>
                        <!--// grid wrap end -->

                        <!-- grid bottom start -->
                        <article class="grid-bottom-area">
                            <!-- 페이징 -->
                            <nav class="page-navigation" aria-label="page navigation">
                                <script type="module" src="../../assets/js/components/pagination.js"></script>
                            </nav>
                            <!--// 페이징 -->
                        </article>
                        <!--// grid bottom end -->
                    
                    </div>
                    <!--// 컨텐츠 영역 -->

                </main>

            </div>
        </section>
        <!--// 컨테이너 영역 -->

        <!-- 푸터 영역 -->
        <footer id="kdhc-footer">
            <script type="module" src="../../assets/js/layouts/footer.js"></script>
        </footer>
        <!--// 푸터 영역 -->
 
    </div>
    <!-- script wrap -->
    <script type="module">
        const rowData = [
            {
                field01: "관리자",
                field02: "공통코드 관리",
                field03: "공통코드 관리페이지(수정가능)",
                field04: "www.google.com",
                field05: "홍길동",
                field06: "2024.12.10 12:20:33",
            },
            {
                field01: "관리자",
                field02: "공통코드 관리",
                field03: "공통코드 관리페이지(수정가능)",
                field04: "www.naver.com",
                field05: "홍길동",
                field06: "2024.12.10 12:20:33",
            }
        ];
        const columnDefs = [
            {
                headerName: "메뉴 1",
                headerClass: "center",
                field: "field01",
                width: 240,
                cellClass: "cell-normal",
            },
            {
                headerName: "메뉴 2",
                headerClass: "center",
                field: "field02",
                width: 240,
                cellClass: "cell-normal",
            },
            {
                headerName: "페이지 명",
                headerClass: "center",
                field: "field03",
                width: 280,
                editable: true,
                cellClass: "cell-normal",
            },
            {
                headerName: "URL",
                headerClass: "center",
                field: "field04",
                minWidth: 480,
                flex: 1,
                editable: true,
                cellClass: "cell-normal",
                cellRenderer: (params) => {
                    return `<a href="http://${params.value}" target="_blank">${params.value}</a>(수정가능)`;
                }
            },
            {
                headerName: "등록자",
                headerClass: "center",
                field: "field05",
                width: 120,
                cellClass: "cell-normal",
            },
            {
                headerName: "등록일자",
                headerClass: "center",
                field: "field06",
                width: 200,
                cellClass: "cell-normal",
            },
        ];
        let sampleGridApi;

        const sampleGridOptions = {
            defaultColDef: {
                editable: false, // edit 사용 유무
                autoHeight: true,
                sortable: true, // sort 사용 유무
            }, 
            columnDefs,
            headerHeight: 39, // header height
            rowData: rowData,
            rowHeight: 47, // row height
            domLayout: "autoHeight", // 2025-02-19 추가 옵션
            suppressColumnVirtualisation: true, // 2025-02-19 추가 옵션
            // data empty style
            overlayNoRowsTemplate: '<div class="empty"><div class="empty-img"></div><div class="empty-txt">데이타가 없습니다.</div></div>',
        };
        const sampleGridDiv = document.querySelector("#sampleGrid");
        sampleGridApi = agGrid.createGrid(sampleGridDiv, sampleGridOptions);
    </script>
    <!--// script wrap -->
    
    <!-- modal wrap -->
    <!--// modal wrap -->
</body>
</html>
