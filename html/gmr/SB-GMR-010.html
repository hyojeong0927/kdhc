<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <!-- css -->
    <link rel="stylesheet" href="../../css/index.css">
    <!-- script -->
    <script src="../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script src="../../assets/js/vendors/bootstrap-treeview.min.js"></script>
    <script type="module" src="../../assets/js/common.js"></script>
</head>
<body>
    <div id="wrap" class="kdhc-wrap">

        <!-- 본문 바로가기 영역 -->
        <div id="kdhc-skip-link">
            <a href="#contents">본문 바로가기</a>
        </div>
        <!--// 본문 바로가기 영역  -->

        <!-- 상단 배너영역 -->
        <div id="kdhc-masthead">
            <div class="toggle-wrap">
                <div class="toggle-head">
                    <div class="inner">
                        <span class="nuri-txt">이 누리집은 한국지역난방공사 제어망 스마트 보안관리 플랫폼 누리집입니다.</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- // 상단 배너영역 -->

        <!-- 헤더 영역 -->
       <header id="kdhc-header" data-menu='[
            { "title": "관리보안", "url": "#" },
            { "title": "물리보안", "url": "#" },
            { "title": "기술보안", "url": "#" },
            { "title": "보안정책", "url": "#" },
            { "title": "클린PC", "url": "#" }
            { "title": "정보자산", "url": "#" }
            { "title": "관리자", "url": "#", "active": true }]'>
            <script type="module" src="../../assets/js/layouts/header.js"></script>
        </header>
        <!--// 헤더 영역 -->

        <!-- 컨테이너 영역 -->
        <section id="kdhc-container">
            <div class="inner">
                <!-- 사이드 영역 -->
                <script type="module" src="../../assets/js/layouts/sidebar.js"></script>
                <aside id="sidebar" class="sidebar" data-menu='[
                        { "name": "공지사항 관리", "url": "#" },
                        { "name": "보고서 일정 관리", "url": "#" },
                        { "name": "지침 및 매뉴얼 관리", "url": "#" },
                        { "name": "메뉴 관리", "url": "#", "active": true },
                        { "name": "권한별 메뉴 관리", "url": "#" },
                        { "name": "페이지 관리", "url": "#" },
                        { "name": "사용자 관리", "url": "#" },
                        { "name": "공통코드 관리", "url": "#" },
                        { "name": "인사이동 관리", "url": "#" },
                        { "name": "USB 저장매체 사용현황", "url": "#" },
                        { "name": "스티커 이용내역", "url": "#" }
                        ]'></aside>
                <!--// 사이드 영역 -->

                <main class="main-contents">
                    <!-- breadcrumbs start : 현재 히든 처리 추후 변경 가능 -->
                    <nav id="breadcrumb" class="breadcrumb-wrap" aria-label="breadcrumb" 
                        data-breadcrumb='[
                            { "name": "관리자", "url": "#" },
                            { "name": "메뉴 관리", "url": "", "active": true }
                        ]'
                        data-visible="false">
                    </nav> 
                    <!--// breadcrumbs end -->
                    
                    <!-- 컨텐츠 영역 -->
                    <div id="contents" class="contents">

                        <!-- page title start -->
                        <div class="page-title-wrap" 
                            data-title="메뉴 관리" 
                            data-badge=""
                            data-badge-visible="false">
                        </div>
                        <!--// page title end -->
                        <!-- 메뉴관리 start -->
                        <div class="flex-form">
                            <div class="flex-form-left tree-view">
                                <!-- tree -->
                                <div id="tree" class="treeview"></div>
                                <script type="module" src="../../assets/js/components/treeView.js"></script>
                                <!--// tree -->
                            </div>
                            <div class="flex-form-right">
                                <!-- input form -->
                                <div class="input-form-area">
                                    <!-- form start -->
                                    <form>
                                        <fieldset>
                                            <!-- form-wrap start -->
                                            <div class="form-wrap type02">
                                                <!-- row -->
                                                <div class="form-row">
                                                    <div class="col">
                                                        <div class="form-label" aria-required="true">메뉴 명</div>
                                                        <div class="form-group">
                                                            <!-- input group -->
                                                            <div class="input-group w-50 is-error">
                                                                <input type="text" id="input-text" class="form-control" placeholder="메뉴 명 입력" value="">
                                                                <label for="input-text" class="hidden">그룹코드</label>
                                                            </div>
                                                            <!--// input group -->
                                                            <!-- 에러 문구 -->
                                                            <p class="form-hint-invalid">잘못 입력하였습니다.</p>
                                                            <!--// 에러 문구 -->
                                                        </div>
                                                    </div>
                                                </div>
                                            <!-- row -->
                                                <div class="form-row">
                                                    <div class="col">
                                                        <div class="form-label" aria-required="true">페이지명</div>
                                                        <div class="form-group">
                                                            <!-- select-group -->
                                                            <div class="select-group w-50">
                                                                <select class="form-select" aria-label="Default select" required>
                                                                    <option value="" selected>선택하세요</option>
                                                                    <option value="1">One</option>
                                                                    <option value="2">Two</option>
                                                                    <option value="3">Three</option>
                                                                </select>
                                                            </div>
                                                            <!--// select-group -->
                                                            <!-- 에러 문구 : hidden -->
                                                            <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                            <!--// 에러 문구 -->
                                                        </div>
                                                    </div>
                                                </div>
                                                <!-- row -->
                                                <div class="form-row">
                                                    <div class="col">
                                                        <div class="form-label">메뉴 설명</div>
                                                        <div class="form-group">
                                                            <!-- input group -->
                                                            <div class="input-group is-error">
                                                                <input type="text" id="input-text" class="form-control" placeholder="메뉴 설명 입력" value="">
                                                                <label for="input-text" class="hidden">그룹코드</label>
                                                            </div>
                                                            <!--// input group -->
                                                            <!-- 에러 문구 -->
                                                            <p class="form-hint-invalid">잘못 입력하였습니다.</p>
                                                            <!--// 에러 문구 -->
                                                        </div>
                                                    </div>
                                                </div>
                                                <!-- row -->
                                                <div class="form-row">
                                                    <div class="col">
                                                        <div class="form-label">노출 순위</div>
                                                        <div class="form-group">
                                                            <!-- input group -->
                                                            <div class="input-group w-50 is-error">
                                                                <input type="number" id="input-text" class="form-control" placeholder="노출 순위 입력" value="">
                                                                <label for="input-text" class="hidden">노출 순위</label>
                                                            </div>
                                                            <!--// input group -->
                                                            <!-- 에러 문구 -->
                                                            <p class="form-hint-invalid">잘못 입력하였습니다.</p>
                                                            <!--// 에러 문구 -->
                                                        </div>
                                                    </div>
                                                </div>
                                                <!-- row -->
                                                <div class="form-row">
                                                    <div class="col">
                                                        <div class="form-label">활성화 여부</div>
                                                        <div class="form-group">
                                                            <!-- input-txt -->
                                                            <div class="input-txt">
                                                                홍길동
                                                            </div>
                                                            <!--// input-txt -->
                                                        </div>
                                                    </div>
                                                </div>
                                                <!-- row -->
                                                <div class="form-row">
                                                    <div class="col">
                                                        <div class="form-label">최종 변경 일시</div>
                                                        <div class="form-group">
                                                            <!-- input-txt -->
                                                            <div class="input-txt">
                                                                2024.12.10 12:20:33
                                                            </div>
                                                            <!--// input-txt -->
                                                        </div>
                                                    </div>
                                                </div>
                                                <!--// row end-->
                                            </div>
                                            <!--// form-wrap end -->
                                        </fieldset>
                                    </form>
                                    <!-- form end -->
                                </div>
                                <!--// input form -->
                            </div>
                        </div>
                        <!--// 메뉴관리 end -->
                        <!-- bottom button area start -->
                        <div class="bottom-btn-area" 
                            data-buttons='[{"text": "추가", "class": "btn btn-outline btn-md"}, {"text": "삭제", "class": "btn btn-outline btn-md"}, {"text": "저장"}]'>
                        </div>
                        <!--// bottom button area end -->
                    </div>
                    <!--// 컨텐츠 영역 -->

                </main>

            </div>
        </section>
        <!--// 컨테이너 영역 -->

        <!-- 푸터 영역 -->
        <footer id="kdhc-footer">
            <script type="module" src="../../assets/js/layouts/footer.js"></script>
        </footer>
        <!--// 푸터 영역 -->
 
    </div>
    <!-- script wrap -->
   
    <!--// script wrap -->
    
    <!-- modal wrap -->
    <!--// modal wrap -->
</body>
</html>
