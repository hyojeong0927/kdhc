<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <link rel="icon" href="../../../assets/favicon.svg" type="image/x-icon">
    <!-- css -->
    <link rel="stylesheet" href="../../../css/agGrid.css">
    <link rel="stylesheet" href="../../../css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="../../../css/bootstrap-treeview.min.css">
    <link rel="stylesheet" href="../../../css/style.css?v=20250613"><!-- 버전 관리 적용 -->
    <!-- script -->
    <script src="../../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../../assets/js/common.js"></script>
    <script src="../../../assets/js/components/inputFile.js"></script>
</head>

<body>
    <div id="pop-wrap" class="kdhc-pop-wrap">
        <header class="kdhc-pop-header">
            <h1 class="pop-title">공지사항관리/등록(수정)</h1>
            <button type="button" class="btn-close" aria-label="Close" onclick="window.close()"></button>
        </header>
        <!-- 팝업 컨테이너 영역 -->
        <section class="kdhc-pop-container">
            <div class="inner">
                <!-- 팝업 컨텐츠 영역 -->
                <div class="contents">
                    <!-- breadcrumbs start -->
                    <nav id="breadcrumb" class="breadcrumb-wrap" aria-label="breadcrumb" data-breadcrumb='[
                        { "name": "관리자", "url": "#" },
                        { "name": "공지사항관리/등록(수정)", "url": "", "active": true }
                        ]' data-visible="true">
                    </nav>
                    <!--// breadcrumbs end -->

                    <div class="section">
                        <!-- input form -->
                        <div class="input-form-area">
                            <!-- form start -->
                            <form>
                                <fieldset>
                                    <!-- form-wrap start -->
                                    <div class="form-wrap type02">
                                        <!-- row -->
                                        <div class="form-row">
                                            <div class="col">
                                                <div class="form-label" aria-required="false">등록일자</div>
                                                <div class="form-group">
                                                    <div class="input-txt">2025.03.24</div>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- row -->
                                        <div class="form-row">
                                            <div class="col">
                                                <div class="form-label" aria-required="false">등록유형</div>
                                                <div class="form-group">
                                                    <!-- form-check-group -->
                                                    <div class="form-check-group">
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="radio" id="radio01" name="drone1" value="radio01" checked />
                                                            <label for="radio01">게시물</label>
                                                        </div>
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="radio" id="radio02" name="drone1" value="radio02" />
                                                            <label for="radio02">팝업</label>
                                                        </div>
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="radio" id="radio03" name="drone1" value="radio03" />
                                                            <label for="radio03">배너</label>
                                                        </div>
                                                    </div>
                                                    <!--// form-check-group -->
                                                </div>
                                            </div>
                                        </div>
                                        <!-- row -->
                                        <div class="form-row">
                                            <!-- col -->
                                            <div class="col">
                                                <div class="form-label" aria-required="false">팝업 전시기간</div>
                                                <div class="form-group">
                                                    <!-- datepicker-group start -->
                                                    <div class="datepicker-group">
                                                        <!-- input-date-group is-error -->
                                                        <div class="input-date-group">
                                                            <input type="text" id="startDate" class="form-control" value="" placeholder="YYYY-MM-DD" readonly>
                                                            <label class="input-group-text" for="startDate"><i class="icon calendar"></i></label>
                                                        </div>
                                                        <div class="to">-</div>
                                                        <!-- input-date-group is-error -->
                                                        <div class="input-date-group">
                                                            <input type="text" id="endDate" class="form-control" value="" placeholder="YYYY-MM-DD" readonly>
                                                            <label class="input-group-text" for="endDate"><i class="icon calendar"></i></label>
                                                        </div>
                                                    </div>
                                                    <!--// datepicker-group end -->
                                                    <!-- 에러 문구 : hidden-->
                                                    <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                    <!--// 에러 문구 -->
                                                </div>
                                            </div>
                                            <!--// col -->
                                            <!-- col -->
                                            <div class="col">
                                                <div class="form-label" aria-required="false">배너 전시기간</div>
                                                <div class="form-group">
                                                    <!-- datepicker-group start -->
                                                    <div class="datepicker-group">
                                                        <!-- input-date-group is-error -->
                                                        <div class="input-date-group">
                                                            <input type="text" id="startDate" class="form-control" value="" placeholder="YYYY-MM-DD" readonly>
                                                            <label class="input-group-text" for="startDate"><i class="icon calendar"></i></label>
                                                        </div>
                                                        <div class="to">-</div>
                                                        <!-- input-date-group is-error -->
                                                        <div class="input-date-group">
                                                            <input type="text" id="endDate" class="form-control" value="" placeholder="YYYY-MM-DD" readonly>
                                                            <label class="input-group-text" for="endDate"><i class="icon calendar"></i></label>
                                                        </div>
                                                    </div>
                                                    <!--// datepicker-group end -->
                                                    <!-- 에러 문구 : hidden-->
                                                    <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                    <!--// 에러 문구 -->
                                                </div>
                                            </div>
                                            <!--// col -->
                                        </div>
                                        <!-- row -->
                                        <div class="form-row">
                                            <!-- col -->
                                            <div class="col">
                                                <div class="form-label" aria-required="true">제목</div>
                                                <div class="form-group">
                                                    <!-- input-group is-error -->
                                                    <div class="input-group">
                                                        <input type="text" id="input-text" class="form-control" placeholder="제목" value="">
                                                        <label for="input-text" class="hidden">제목</label>
                                                    </div>
                                                    <!--// input group -->
                                                    <!-- 에러 문구 :  hidden 제거 -->
                                                    <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                    <!--// 에러 문구 -->
                                                </div>
                                            </div>
                                            <!--// col -->
                                            <!-- col -->
                                            <div class="col">
                                                <div class="form-label" aria-required="false">파일 업로드</div>
                                                <div class="form-group">
                                                    <!-- input-file-group -->
                                                    <div class="input-file-group">
                                                        <label for="file">파일선택</label>
                                                        <input class="upload-name" value="선택된 파일이 없습니다." placeholder="선택된 파일이 없습니다.">
                                                        <input type="file" id="file" multiple>
                                                    </div>
                                                    <!--// input-file-group -->
                                                </div>
                                            </div>
                                            <!--// col -->
                                        </div>
                                        <!-- row -->
                                        <div class="form-row">
                                            <div class="col">
                                                <div class="form-label" aria-required="true">내용</div>
                                                <div class="form-group">
                                                    <!-- textarea-group is-error -->
                                                    <div class="textarea-group h-300">
                                                        <textarea class="form-control" id="comment" placeholder="내용"></textarea>
                                                    </div>
                                                    <!--// textarea -->
                                                    <!-- 에러 문구 : hidden 제거 -->
                                                    <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                    <!--// 에러 문구 -->
                                                </div>
                                            </div>
                                        </div>
                                        <!--// row end-->
                                    </div>
                                    <!--// form-wrap end -->
                                </fieldset>
                            </form>
                            <!-- form end -->
                        </div>
                        <!--// input form -->
                        <!-- bottom button area start -->
                        <div class="bottom-btn-area" data-buttons='[{"text": "삭제", "class": "btn btn-outline btn-md"}, {"text": "저장"}]'></div>
                        <!--// bottom button area end -->
                    </div>
                </div>
                <!--// 팝업 컨텐츠 영역 -->
            </div>
        </section>
        <!--// 팝업 컨테이너 영역 -->
    </div>
</body>

</html>
