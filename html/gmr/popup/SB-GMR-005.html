<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <!-- css -->
    <link rel="stylesheet" href="../../../css/index.css">
    <!-- script -->
    <script src="../../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../../assets/js/common.js"></script>
</head>
<body>
    <div id="pop-wrap" class="kdhc-pop-wrap">
        <header class="kdhc-pop-header">
            <h1 class="pop-title" id="staticBackdropLabel">정기점검 관리 등록/수정</h1>
            <button type="button" class="btn-close" aria-label="Close" onclick="window.close()"></button>
        </header>
        <!-- 팝업 컨테이너 영역 -->
        <section class="kdhc-pop-container">
            <div class="inner">
                <!-- 팝업 컨텐츠 영역 -->
                <div class="contents">

                    <!-- input form -->
                    <div class="input-form-area">
                        <!-- form start -->
                        <form>
                            <fieldset>
                                <!-- form-wrap start -->
                                <div class="form-wrap type02">
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col  -->
                                        <div class="col">
                                            <div class="form-label">점검 주기 유형</div>
                                            <div class="form-group">
                                                <!-- form check group -->
                                                <div class="form-check-group">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="radio01" name="drone1" value="radio01" checked />
                                                        <label for="radio01">일간</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="radio02" name="drone1" value="radio02" />
                                                        <label for="radio02">주간</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="radio02" name="drone1" value="radio03" />
                                                        <label for="radio03">월간</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="radio02" name="drone1" value="radio04" />
                                                        <label for="radio04">분기</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="radio02" name="drone1" value="radio05" />
                                                        <label for="radio05">반기</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="radio02" name="drone1" value="radio06" />
                                                        <label for="radio06">연간</label>
                                                    </div>
                                                </div>
                                                <!--// form check group -->
                                                <!-- 에러 문구 : hidden 제거 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    <!--// row -->
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col  -->
                                        <div class="col">
                                            <div class="form-label">점검기간</div>
                                            <div class="form-group">
                                                <!-- datepicker-group start -->
                                                <div class="datepicker-group">
                                                    <div class="datepicker-btn-group">
                                                        <button class="btn btn-outline--round btn-xsm active">1개월</button>
                                                        <button class="btn btn-outline--round btn-xsm">3개월</button>
                                                        <button class="btn btn-outline--round btn-xsm">6개월</button>
                                                        <button class="btn btn-outline--round btn-xsm" disabled>12개월</button>
                                                    </div>
                                                    <!-- class="input-date-group is-error" -->
                                                    <div class="input-date-group">
                                                        <input type="text" id="startDate" class="form-control" value="" placeholder="YYYY-MM-DD" readonly>
                                                        <label class="input-group-text" for="startDate"><i class="icon calendar"></i></label>
                                                    </div>
                                                    <div class="to">-</div>
                                                    <!-- class="input-date-group is-error" -->
                                                    <div class="input-date-group">
                                                        <input type="text" id="endDate" class="form-control" value="" placeholder="YYYY-MM-DD" readonly>
                                                        <label class="input-group-text" for="endDate"><i class="icon calendar"></i></label>
                                                    </div>
                                                </div>
                                                <!--// datepicker-group end -->
                                                <!-- 에러 문구 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col -->
                                    </div>
                                    <!--// row -->
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col  -->
                                        <div class="col">
                                            <div class="form-label">점검명</div>
                                            <div class="form-group">
                                                <div class="multi-group">
                                                    <!-- form select group : class="select-group is-error" -->
                                                    <div class="select-group">
                                                        <select class="form-select" aria-label="Default select" required>
                                                            <option value="" selected>선택</option>
                                                            <option value="1">One</option>
                                                            <option value="2">Two</option>
                                                            <option value="3">Three</option>
                                                        </select>
                                                    </div>
                                                    <!--// form select group -->
                                                    <!-- input group -->
                                                    <div class="input-group">
                                                        <input type="text" id="input-text" class="form-control" placeholder="입력" value="">
                                                        <label for="input-text" class="hidden">점검명</label>
                                                    </div>
                                                    <!--// input group -->
                                                </div>
                                                <!-- 에러 문구 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    <!--// row -->
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col  -->
                                        <div class="col">
                                            <div class="form-label">대상지사</div>
                                            <div class="form-group">
                                                
                                                <!-- 에러 문구 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    <!--// row -->
                                </div>
                                <!--// form-wrap end -->
                            </fieldset>
                        </form>
                        <!--// form end -->
                    </div>
                    <!--// input form -->

                    <!-- bottom button area start -->
                    <div class="bottom-btn-area" data-buttons='[{"text": "삭제", "class": "btn btn-outline btn-md"}, {"text": "저장"}]'></div>
                    <!--// bottom button area end -->
             </div>

                </div>
                <!--// 팝업 컨텐츠 영역 -->
            </div>
        </section>
        <!--// 팝업 컨테이너 영역 -->
    </div>
    <!-- script wrap -->
    <!--// script wrap -->
</body>
</html>
