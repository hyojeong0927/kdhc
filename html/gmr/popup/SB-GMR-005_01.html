<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <link rel="icon" href="../../../assets/favicon.svg" type="image/x-icon">
    <!-- css -->
    <link rel="stylesheet" href="../../../css/agGrid.css">
    <link rel="stylesheet" href="../../../css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="../../../css/bootstrap-treeview.min.css">
    <link rel="stylesheet" href="../../../css/style.css?v=20250613"><!-- 버전 관리 적용 -->
    <!-- script -->
    <script src="../../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../../assets/js/common.js"></script>
</head>
<body>
    <div id="pop-wrap" class="kdhc-pop-wrap">
        <header class="kdhc-pop-header">
            <h1 class="pop-title" id="staticBackdropLabel">정기점검 관리 등록/수정</h1>
            <button type="button" class="btn-close" aria-label="Close" onclick="window.close()"></button>
        </header>
        <!-- 팝업 컨테이너 영역 -->
        <section class="kdhc-pop-container">
            <div class="inner">
                <!-- 팝업 컨텐츠 영역 -->
                <div class="contents">

                    <!-- input form -->
                    <div class="input-form-area">
                        <!-- form start -->
                        <form>
                            <fieldset>
                                <!-- form-wrap start -->
                                <div class="form-wrap type02">
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col  -->
                                        <div class="col">
                                            <div class="form-label">점검 주기 유형</div>
                                            <div class="form-group">
                                                <!-- form check group -->
                                                <div class="form-check-group">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="radio01" name="drone1" value="radio01" />
                                                        <label for="radio01">일간</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="radio02" name="drone1" value="radio02" checked />
                                                        <label for="radio02">주간</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="radio03" name="drone1" value="radio03" />
                                                        <label for="radio03">월간</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="radio04" name="drone1" value="radio04" />
                                                        <label for="radio04">분기</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="radio05" name="drone1" value="radio05" />
                                                        <label for="radio05">반기</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="radio06" name="drone1" value="radio06" />
                                                        <label for="radio06">연간</label>
                                                    </div>
                                                </div>
                                                <!--// form check group -->
                                                <!-- 에러 문구 : hidden 제거 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    <!--// row -->
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col  -->
                                        <div class="col">
                                            <div class="form-label">점검기간</div>
                                            <div class="form-group">
                                                <!-- datepicker-group start -->
                                                <div class="datepicker-group">
                                                    <!-- input-date-group is-error -->
                                                    <div class="input-date-group w-190">
                                                        <input type="text" id="startDate" class="form-control" value="" placeholder="YYYY-MM-DD" readonly>
                                                        <label class="input-group-text" for="startDate"><i class="icon calendar"></i></label>
                                                    </div>
                                                    <div class="to">-</div>
                                                    <!-- input-date-group is-error -->
                                                    <div class="input-date-group w-190">
                                                        <input type="text" id="endDate" class="form-control" value="" placeholder="YYYY-MM-DD" readonly>
                                                        <label class="input-group-text" for="endDate"><i class="icon calendar"></i></label>
                                                    </div>
                                                </div>
                                                <!--// datepicker-group end -->
                                                <!-- 에러 문구 :  hidden 제거 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col -->
                                        <!-- col  -->
                                        <div class="col">
                                            <div class="form-label">점검요일</div>
                                            <div class="form-group">
                                                <!-- form check group -->
                                                <div class="form-check-group">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="mon" name="week" value="mon" checked />
                                                        <label for="mon">월</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="tus" name="week" value="tus" />
                                                        <label for="tus">화</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="wen" name="week" value="wen" />
                                                        <label for="wen">수</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="thu" name="week" value="thu" />
                                                        <label for="thu">목</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="fri" name="week" value="fri" />
                                                        <label for="fri">금</label>
                                                    </div>
                                                </div>
                                                <!--// form check group -->
                                                <!-- 에러 문구 : hidden 제거 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    <!--// row -->
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col  -->
                                        <div class="col">
                                            <div class="form-label">점검명</div>
                                            <div class="form-group">
                                                <div class="multi-group">
                                                    <!-- select-group is-error -->
                                                    <div class="select-group w-190">
                                                        <select class="form-select" aria-label="Default select" required>
                                                            <option value="" selected>선택</option>
                                                            <option value="1">One</option>
                                                            <option value="2">Two</option>
                                                            <option value="3">Three</option>
                                                        </select>
                                                    </div>
                                                    <!--// form select group -->
                                                    <!-- input-group is-error  -->
                                                    <div class="input-group">
                                                        <input type="text" id="input-text" class="form-control" placeholder="입력" value="">
                                                        <label for="input-text" class="hidden">점검명</label>
                                                    </div>
                                                    <!--// input group -->
                                                </div>
                                                <!-- 에러 문구 : hidden 제거 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    <!--// row -->
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col  -->
                                        <div class="col">
                                            <div class="form-label">미리알림</div>
                                            <div class="form-group">
                                                <div class="multi-group">
                                                    <!-- input-group is-error  -->
                                                    <div class="input-group w-190">
                                                        <input type="text" id="input-text" class="form-control" placeholder="입력" value="1~3">
                                                        <label for="input-text" class="hidden">미리알림</label>
                                                    </div>
                                                    <!--// input group -->
                                                    <div class="input-text">일 전부터</div>
                                                </div>
                                                <!-- 에러 문구 : hidden 제거 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    <!--// row -->
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col  -->
                                        <div class="col">
                                            <div class="form-label">대상지사</div>
                                            <div class="form-group">
                                                <!-- form-check-group -->
                                                <div class="form-check-group">
                                                    <div class="form-check">
                                                        <input class="form-check-input checkboxes" type="checkbox" id="selectAllCheckbox" name="selectAllCheckbox">
                                                        <label for="selectAllCheckbox">전체</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input checkboxes" type="checkbox" id="checkbox01" name="checkbox01">
                                                        <label for="checkbox01">고양</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input checkboxes" type="checkbox" id="checkbox02" name="checkbox02">
                                                        <label for="checkbox02">김해</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input checkboxes" type="checkbox" id="checkbox03" name="checkbox03">
                                                        <label for="checkbox03">마포</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input checkboxes" type="checkbox" id="checkbox04" name="checkbox04">
                                                        <label for="checkbox04">목동</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input checkboxes" type="checkbox" id="checkbox05" name="checkbox05">
                                                        <label for="checkbox05">부천</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input checkboxes" type="checkbox" id="checkbox06" name="checkbox06">
                                                        <label for="checkbox06">분당</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input checkboxes" type="checkbox" id="checkbox07" name="checkbox07">
                                                        <label for="checkbox07">수원</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input checkboxes" type="checkbox" id="checkbox08" name="checkbox08">
                                                        <label for="checkbox08">용인</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input checkboxes" type="checkbox" id="checkbox09" name="checkbox09">
                                                        <label for="checkbox09">청주</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input checkboxes" type="checkbox" id="checkbox10" name="checkbox10">
                                                        <label for="checkbox10">파주</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input checkboxes" type="checkbox" id="checkbox11" name="checkbox11">
                                                        <label for="checkbox11">판교</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input checkboxes" type="checkbox" id="checkbox12" name="checkbox12">
                                                        <label for="checkbox12">화성</label>
                                                    </div>
                                                </div>
                                                <!--// form-check-group -->
                                                <!-- 에러 문구 :  hidden 제거 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    <!--// row -->
                                </div>
                                <!--// form-wrap end -->
                            </fieldset>
                        </form>
                        <!--// form end -->
                    </div>
                    <!--// input form -->

                    <!-- bottom button area start -->
                    <div class="bottom-btn-area" data-buttons='[{"text": "삭제", "class": "btn btn-outline btn-md"}, {"text": "저장"}]'></div>
                    <!--// bottom button area end -->
             </div>

                </div>
                <!--// 팝업 컨텐츠 영역 -->
            </div>
        </section>
        <!--// 팝업 컨테이너 영역 -->
    </div>
    <!-- script wrap -->
     <script type="module" src="../../../assets/js/components/checkbox.js"></script>
    <!--// script wrap -->
</body>
</html>
