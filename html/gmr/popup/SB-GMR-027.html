    <script type="module">
        import { customInputSearchEditor } from "../../../assets/js/components/agGridComponents.js"
        const rowData = [

                field04: "대구",
                field05: "divider",

                field02: "987654",
                field03: "양병만",
                field04: "대구",
                field05: "divider",
                field06: "",
                field07: "판교",
                field08: "공무부",
                field09: "제어과",
                field10: "팀장",
                field11: "",
            },
            {
                field01: "",
                field02: "987654",
                field03: "양병만",
                field04: "대구",
                field05: "divider",
                field06: "",
                field07: "판교",
                field08: "계전부",
                field09: "",
                field10: "제어보호 담당자",
                field11: "",
            },
            {
                field01: "",
                field02: "234567",
                field03: "박동원",
                field04: "파주",
                field05: "divider",
                field06: "checked",
                field07: "판교",
                field08: "공무부",
                field09: "기계과",
                field10: "직원",
                field11: "",
            },
            {
                field01: "",
                field02: "234567",
                field03: "홍길동",
                field04: "광주",
                field05: "divider",
                field06: "checked",
                field07: "판교",
                field08: "계전부",
                field09: "기계과",
                field10: "제어보호 담당관",
                field11: "",
            },
        ];
        const columnDefs = [
            {
                headerName: "순번",
                headerClass: "center",
                field: "field01",
                width: 88,
                cellClass: "cell-normal",
                valueGetter: "node.rowIndex + 1"
            },
            {
                headerName: "사번",
                headerClass: "center",
                field: "field02",
                width: 120,
                cellClass: "cell-normal",
            },
            {
                headerName: "이름",
                headerClass: "center",
                field: "field03",
                width: 180,
                cellClass: "cell-normal input",
                cellEditor: 'customInputSearchEditor',
                cellRenderer: (params) => {
                    const value = params.value;
                    const rowIndex = params.node.rowIndex;

                    return `
                        <!-- input-search-group is-error -->
                        <div class="input-search-group">
                            <input type="search" class="form-control" id="search1-${rowIndex}" placeholder="이름" value="${value || ''}">
                            <label class="input-group-text" for="search1-${rowIndex}"><i class="icon search"></i></label>
                        </div>
                        <!--// input search group -->
                    `;
                }
            },
            {
                headerName: "현지사",
                headerClass: "center",
                field: "field04",
                minWidth: 120,
                flex: 1,
                cellClass: "cell-normal",
            },
            {
                headerName: "",
                headerClass: "center headerBlank",
                field: "field05",
                width: 30,
                cellClass: getMergeCellClass,
                rowSpan: (params) => shouldMergeRows(params, ["field05"]),
                cellRenderer: (params) => {
                    const value = params.value;
                    
                    if (value === "divider") {
                        return `<i class="icon arrow-right"></i>`;
                    }
                    return '';
                }
            },
            {
                headerName: "주부서과",
                headerClass: "center bgColor",
                field: "field06",
                width: 88,
                cellClass: "cell-normal",
                cellEditor: 'agCheckboxCellEditor',
                cellRenderer: params => {
                    return `
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault1" ${params.value ? 'checked' : ''}>
                            <label class="form-check-label hidden" for="flexCheckDefault1">default</label>
                        </div>
                    `;
                }
            },
            {
                headerName: "발령지사",
                headerClass: "center bgColor",
                field: "field07",
                minWidth: 150,
                flex: 1,
                cellClass: "cell-normal",
            },
            {
                headerName: "발령부서",
                headerClass: "center bgColor",
                field: "field08",
                minWidth: 150,
                flex: 1,
                cellClass: "cell-normal input",
                cellRenderer: (params) => {
                    const value = params.value;
                    const rowIndex = params.node.rowIndex;

                    return `
                        <!-- select-group -->
                        <div class="select-group">
                            <select class="form-select" id="select-${rowIndex}" name="select-${rowIndex}" data-row-index="${rowIndex}" aria-label="Default select" required>
                                <option value="" ${!value ? "selected" : ""}>선택</option>
                                <option value="계전부" ${value === "계전부" ? "selected" : ""}>계전부</option>
                                <option value="공무부" ${value === "공무부" ? "selected" : ""}>공무부</option>
                            </select>
                        </div>
                        <!--// select-group -->
                    `;
                }
            },
            {
                headerName: "발령부서과",
                headerClass: "center bgColor",
                field: "field09",
                minWidth: 150,
                flex: 1,
                cellClass: "cell-normal input",
                editable: true,
                cellRenderer: (params) => {
                    const value = params.value;
                    const rowIndex = params.node.rowIndex;
                    return `
                        <!-- select-group -->
                        <div class="select-group">
                            <select class="form-select" id="select-${rowIndex}" name="select-${rowIndex}" data-row-index="${rowIndex}" aria-label="Default select" required>
                                <option value="" ${!value ? "selected" : ""}>선택</option>
                                <option value="제어과" ${value === "제어과" ? "selected" : ""}>제어과</option>
                                <option value="전산과" ${value === "전산과" ? "selected" : ""}>전산과</option>
                                <option value="배전과" ${value === "배전과" ? "selected" : ""}>배전과</option>
                                <option value="기계과" ${value === "기계과" ? "selected" : ""}>기계과</option>
                            </select>
                        </div>
                        <!--// select-group -->
                    `;
                }
            },
            {
                headerName: "권한",
                headerClass: "center bgColor",
                field: "field10",
                minWidth: 220,
                flex: 1,
                cellClass: "cell-normal input",
                editable: true,
                cellRenderer: (params) => {
                    const value = params.value;
                    const rowIndex = params.node.rowIndex;

                    return `
                        <!-- select-group -->
                        <div class="select-group">
                            <select class="form-select" id="select-${rowIndex}" name="select-${rowIndex}" data-row-index="${rowIndex}" aria-label="Default select" required>
                                <option value="" ${!value ? "selected" : ""}>선택</option>
                                <option value="팀장" ${value === "팀장" ? "selected" : ""}>팀장</option>
                                <option value="제어보호 담당자" ${value === "제어보호 담당자" ? "selected" : ""}>제어보호 담당자</option>
                                <option value="제어보호 담당관" ${value === "제어보호 담당관" ? "selected" : ""}>제어보호 담당관</option>
                                <option value="직원" ${value === "직원" ? "selected" : ""}>직원</option>
                            </select>
                        </div>
                        <!--// select-group -->
                    `;
                }
            },
            {
                headerName: "삭제",
                headerClass: "center bgColor",
                field: "field11",
                width: 80,
                cellClass: "cell-normal",
                cellRenderer: params => {
                    return '<button type="button" class="btn btn-icon"><i class="icon del-trash" /></button>';
                }
            }
        ];

        // rowspan start
        let rowspanMap = {};

        function calculateRowspanMap(data, fields) {
            const mapKey = fields.join(",");
            rowspanMap[mapKey] = {};

            let rowIndex = 0;

            while (rowIndex < data.length) {
                let mergeCount = 1;
                const key = fields.map(field => data[rowIndex][field]).join(",");

                for (let i = rowIndex + 1; i < data.length; i++) {
                    const nextKey = fields.map(field => data[i][field]).join(",");
                    if (nextKey === key) {
                        mergeCount++;
                    } else {
                        break;
                    }
                }

                for (let i = 0; i < mergeCount; i++) {
                    if (i > 0) {
                        fields.forEach(field => {
                            data[rowIndex + i][field] = "";
                        });
                    }
                    rowspanMap[mapKey][rowIndex + i] = i === 0 ? mergeCount : 0;
                }

                rowIndex += mergeCount;
            }
        }

        function shouldMergeRows(params, fields) {
            const mapKey = fields.join(",");
            const rowIndex = params.node.rowIndex;
            return rowspanMap[mapKey]?.[rowIndex] || 1;
        }

        function getMergeCellClass(params) {
            const mapKey = ["field05"].join(",");
            const rowIndex = params.node.rowIndex;

            if (rowspanMap[mapKey]?.[rowIndex] > 1) {
                return "merge-cell merge-cell-bg";
            } else if (rowspanMap[mapKey]?.[rowIndex] === 0) {
                return "blank";
            }
            return "cell-normal";
        }

        function getRowHeight(params) {
            const mapKey = ["field05"].join(",");
            const rowIndex = params.node.rowIndex;
            return rowspanMap[mapKey]?.[rowIndex] > 1 ? 63 * rowspanMap[mapKey][rowIndex] : 63;
        }

        // rowspan end
        
        let sampleGridApi;

        const sampleGridOptions = {
            defaultColDef: {
                editable: true, // edit 사용 유무
                autoHeight: true,
                sortable: false, // sort 사용 유무
            },
            columnDefs,
            headerHeight: 41, // header height
            rowData: rowData,
            rowHeight: 56, // row height
            domLayout: "autoHeight",
            onGridReady: (params) => { // merge option
                calculateRowspanMap(rowData, ["field05"]);
                params.api.refreshCells({ force: true });
                params.api.redrawRows();
            },
            suppressColumnVirtualisation: true,
            suppressRowTransform: true,
            components: {
                customInputSearchEditor
            },
            // data empty style
            overlayNoRowsTemplate: '<div class="empty"><div class="empty-img"></div><div class="empty-txt">데이타가 없습니다.</div></div>',
        };

        const sampleGridDiv = document.querySelector("#sampleGrid");
        sampleGridApi = agGrid.createGrid(sampleGridDiv, sampleGridOptions);
    </script>
