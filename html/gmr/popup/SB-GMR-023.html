<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <link rel="icon" href="../../../assets/favicon.svg" type="image/x-icon">
    <!-- css -->
    <link rel="stylesheet" href="../../../css/agGrid.css">
    <link rel="stylesheet" href="../../../css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="../../../css/bootstrap-treeview.min.css">
    <link rel="stylesheet" href="../../../css/style.css?v=20250613"><!-- 버전 관리 적용 -->
    <!-- script -->
    <script src="../../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../../assets/js/common.js"></script>
</head>
<body>
    <div id="pop-wrap" class="kdhc-pop-wrap small">
        <header class="kdhc-pop-header">
            <h1 class="pop-title" id="staticBackdropLabel">공통코드 수정 팝업</h1>
            <button type="button" class="btn-close" aria-label="Close" onclick="window.close()"></button>
        </header>
        <!-- 팝업 컨테이너 영역 -->
        <section class="kdhc-pop-container">
            <div class="inner">
                <!-- 팝업 컨텐츠 영역 -->
                <div class="contents">
                    <!-- input form -->
                    <div class="input-form-area">
                        <!-- form start -->
                        <form>
                            <fieldset>
                                <!-- form-wrap start -->
                                <div class="form-wrap type02">
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col  -->
                                        <div class="col">
                                            <div class="form-label">그룹코드</div>
                                            <div class="form-group">
                                                <!-- input-group is-error -->
                                                <div class="input-group">
                                                    <input type="text" id="input-text" class="form-control" placeholder="그룹코드 입력" value="">
                                                    <label for="input-text" class="hidden">그룹코드</label>
                                                </div>
                                                <!--// input group -->
                                                <!-- 에러 문구 :  hidden 제거 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    <!--// row -->
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col  -->
                                        <div class="col">
                                            <div class="form-label">그룹코드 명</div>
                                            <div class="form-group">
                                                <!-- input-group is-error -->
                                                <div class="input-group">
                                                    <input type="text" id="input-text" class="form-control" placeholder="그룹코드 명 입력" value="">
                                                    <label for="input-text" class="hidden">그룹코드 명</label>
                                                </div>
                                                <!--// input group -->
                                                <!-- 에러 문구 :  hidden 제거 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col -->
                                    </div>
                                    <!--// row -->
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col  -->
                                        <div class="col">
                                            <div class="form-label">그룹코드 설명</div>
                                            <div class="form-group">
                                                 <!-- textarea-group is-error -->
                                                 <div class="textarea-group w-65">
                                                    <textarea class="form-control" id="comment" placeholder="그룹코드 설명 입력"></textarea>
                                                </div>
                                                <!--// textarea -->
                                                <!-- 에러 문구 :  hidden 제거 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    <!--// row -->
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col  -->
                                        <div class="col">
                                            <div class="form-label">사용 여부</div>
                                            <div class="form-group">
                                                 <!-- form check group -->
                                                 <div class="form-check-group">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="radio01" name="drone1" value="radio01" checked />
                                                        <label for="radio01">사용</label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" id="radio02" name="drone1" value="radio02" />
                                                        <label for="radio02">미사용</label>
                                                    </div>
                                                </div>
                                                <!--// form check group -->
                                                <!-- 에러 문구 :  hidden 제거 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    <!--// row -->
                                </div>
                                <!--// form-wrap end -->
                            </fieldset>
                        </form>
                        <!--// form end -->
                    </div>
                    <!--// input form -->
                </div>
                <!--// 팝업 컨텐츠 영역 -->
            </div>
        </section>
        <!--// 팝업 컨테이너 영역 -->
        <footer class="kdhc-pop-footer">
            <div class="inner">
                <!-- 2025.02.26 버튼 컬러 변경 -->
                <button type="button" class="btn btn-secondary btn-md">저장</button>
            </div>
        </footer>
    </div>
</body>
</html>
