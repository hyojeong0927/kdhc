<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <!-- css -->
    <link rel="stylesheet" href="../../css/index.css">
    <!-- script -->
    <script src="../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../assets/js/common.js"></script>
</head>
<body>
    <div id="wrap" class="kdhc-wrap">

        <!-- 본문 바로가기 영역 -->
        <div id="kdhc-skip-link">
            <a href="#contents">본문 바로가기</a>
        </div>
        <!--// 본문 바로가기 영역  -->

        <!-- 상단 배너영역 -->
        <div id="kdhc-masthead">
            <div class="toggle-wrap">
                <div class="toggle-head">
                    <div class="inner">
                        <span class="nuri-txt">이 누리집은 한국지역난방공사 제어망 스마트 보안관리 플랫폼 누리집입니다.</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- // 상단 배너영역 -->

        <!-- 헤더 영역 -->
        <header id="kdhc-header">
            <script type="module" src="../../assets/js/layouts/header.js"></script>
        </header>
        <!--// 헤더 영역 -->
        <!-- 컨테이너 영역 -->
        <section id="kdhc-container">
            <div class="inner">
                <!-- 사이드 영역 -->
                <script type="module" src="../../assets/js/layouts/sidebar.js"></script>
                <aside id="sidebar" class="sidebar" data-menu='[
                        { "name": "공지사항 관리", "url": "#" },
                        { "name": "보고서 일정 관리", "url": "#" },
                        { "name": "지침 및 매뉴얼 관리", "url": "#" },
                        { "name": "메뉴 관리", "url": "#" },
                        { "name": "권한별 메뉴 관리", "url": "#" },
                        { "name": "페이지 관리", "url": "#" },
                        { "name": "사용자 관리", "url": "#" },
                        { "name": "공통코드 관리", "url": "#", "active": true },
                        { "name": "인사이동 관리", "url": "#" },
                        { "name": "USB 저장매체 사용현황", "url": "#" },
                        { "name": "스티커 이용내역", "url": "#" }
                        ]'></aside>
                <!--// 사이드 영역 -->

                <main class="main-contents">
                    <!-- breadcrumbs start : 현재 히든 처리 추후 변경 가능 -->
                    <nav id="breadcrumb" class="breadcrumb-wrap" aria-label="breadcrumb" 
                        data-breadcrumb='[
                            { "name": "관리자", "url": "#" },
                            { "name": "공통코드 관리", "url": "", "active": true }
                        ]'
                        data-visible="false">
                    </nav> 
                    <!--// breadcrumbs end -->
                    
                <!-- 컨텐츠 영역 -->
                    <div id="contents" class="contents">

                        <!-- page title start -->
                        <div class="page-title-wrap" 
                            data-title="공통코드 관리" 
                            data-badge=""
                            data-badge-visible="false">
                        </div>
                        <!--// page title end -->
                        <button type="button" id="medium-btn" class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
                            공통코드 수정 팝업
                        </button>
                    </div>
                    <!--// 컨텐츠 영역 -->

                </main>

            </div>
        </section>
        <!--// 컨테이너 영역 -->

        <!-- 푸터 영역 -->
        <footer id="kdhc-footer">
            <script type="module" src="../../assets/js/layouts/footer.js"></script>
        </footer>
        <!--// 푸터 영역 -->
 
    </div>
    <!-- script wrap -->
    <!--// script wrap -->
    
    <!-- modal wrap -->
     <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog smd">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title" id="staticBackdropLabel">공통코드 수정 팝업</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="inner">
                        <!-- content start -->
                        <!-- input form -->
                        <div class="input-form-area">
                            <!-- form start -->
                            <form>
                                <fieldset>
                                    <!-- form-wrap start -->
                                    <div class="form-wrap type02">
                                        <!-- row -->
                                        <div class="form-row">
                                            <div class="col">
                                                <div class="form-label">그룹코드</div>
                                                <div class="form-group">
                                                    <!-- input group -->
                                                    <div class="input-group is-error">
                                                        <input type="text" id="input-text" class="form-control" placeholder="그룹코드 입력" value="">
                                                        <label for="input-text" class="hidden">그룹코드</label>
                                                    </div>
                                                    <!--// input group -->
                                                    <!-- 에러 문구 -->
                                                    <p class="form-hint-invalid">잘못 입력하였습니다.</p>
                                                    <!--// 에러 문구 -->
                                                </div>
                                            </div>
                                        </div>
                                        <!-- row -->
                                        <div class="form-row">
                                            <div class="col">
                                                <div class="form-label">그룹코드 명</div>
                                                <div class="form-group">
                                                    <!-- input group -->
                                                    <div class="input-group">
                                                        <input type="text" id="input-text" class="form-control" placeholder="그룹코드 명 입력" value="">
                                                        <label for="input-text" class="hidden">그룹코드 명</label>
                                                    </div>
                                                    <!--// input group -->
                                                    <!-- 에러 문구 -->
                                                    <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                    <!--// 에러 문구 -->
                                                </div>
                                            </div>
                                        </div>
                                        <!-- row -->
                                        <div class="form-row">
                                            <div class="col">
                                                <div class="form-label">그룹코드 설명</div>
                                                <div class="form-group">
                                                     <!-- textarea -->
                                                    <div class="textarea-group w-65">
                                                        <textarea class="form-control" id="comment" placeholder="그룹코드 설명 입력"></textarea>
                                                    </div>
                                                    <!--// textarea -->
                                                    <!-- 에러 문구 -->
                                                    <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                    <!--// 에러 문구 -->
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form-row">
                                            <div class="col">
                                                <div class="form-label">사용 여부</div>
                                                <div class="form-group">
                                                    <!-- form check group -->
                                                    <div class="form-check-group">
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="radio" id="radio01" name="drone1" value="radio01" checked />
                                                            <label for="radio01">사용</label>
                                                        </div>
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="radio" id="radio02" name="drone1" value="radio02" />
                                                            <label for="radio02">미사용</label>
                                                        </div>
                                                    </div>
                                                    <!--// form check group -->
                                                    <!-- 에러 문구 -->
                                                    <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                    <!--// 에러 문구 -->
                                                </div>
                                            </div>
                                        </div>
                                        <!--// row end-->
                                    </div>
                                    <!--// form-wrap end -->
                                </fieldset>
                            </form>
                            <!-- form end -->
                        </div>
                        <!--// input form -->
                        <!--// content start -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary btn-md">저장</button>
                </div>
            </div>
        </div>
    </div>
    <!--// modal wrap -->
</body>
</html>
