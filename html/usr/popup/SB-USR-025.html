<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <!-- css -->
    <link rel="stylesheet" href="../../../css/index.css">
    <!-- script -->
    <script src="../../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../../assets/js/common.js"></script>
</head>
<body>
    <div id="pop-wrap" class="kdhc-pop-wrap">
        <header class="kdhc-pop-header">
            <h1 class="pop-title">자산관리 상세 등록/수정</h1>
            <button type="button" class="btn-close" aria-label="Close" onclick="window.close()"></button>
        </header>
        <!-- 팝업 컨테이너 영역 -->
        <section class="kdhc-pop-container">
            <div class="inner">
                <!-- 팝업 컨텐츠 영역 -->
                <div class="contents">
                    <!-- breadcrumbs start -->
                    <nav id="breadcrumb" class="breadcrumb-wrap" aria-label="breadcrumb" 
                        data-breadcrumb='[
                            { "name": "정보자산", "url": "#" },
                            { "name": "정보보자산관리", "url": "#" },
                            { "name": "자산관리 상세 등록/수정", "url": "", "active": true }
                        ]'
                        data-visible="true">
                    </nav>
                    <!--// breadcrumbs end -->

                    <!--  -->
                    <article class="section">
                        <!-- grid wrap start -->
                        <article class="grid-wrap">
                            <div id="sampleGrid" class="normal" style="width: 100%; height: 100%;"></div>
                        </article>
                        <!--// grid wrap end -->
                    </article>
                    <!--//  -->
                    <!-- 결재정보 -->
                    <article class="section">

                        <!-- section tit start -->
                        <div class="title-wrap" data-title="결재정보" data-heading="h3"></div>
                        <!--// section tit end -->

                        <div class="section-sub">
                            <!-- 결재 컴퍼넌트 영역 -->
                            <div class="approve">

                                <div class="approve-sec">
                                    <div class="title-wrap" data-title="결재정보" data-heading="h6"></div>
                                    <!-- input form -->
                                    <div class="input-form-area">
                                        <!-- form start -->
                                        <form>
                                            <fieldset>
                                                <!-- form-wrap start -->
                                                <div class="form-wrap type02">
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">기안일</div>
                                                            <div class="form-group">
                                                                <div class="input-txt"><!-- 텍스트 영역 --></div>
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">결재 명</div>
                                                            <div class="form-group">
                                                                <div class="input-txt"><!-- 텍스트 영역 --></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!--// row end-->
                                                </div>
                                                <!--// form-wrap end -->
                                            </fieldset>
                                        </form>
                                        <!-- form end -->
                                    </div>
                                    <!--// input form -->
                                </div>

                                <div class="approve-sec">
                                    <div class="title-wrap" data-title="결재상태" data-heading="h6"></div>
                                    <!-- 결재상태 -->
                                    <div class="process-status">
                                        <!-- step start -->
                                        <div id="step-container" class="step step-lg" data-step='[
                                            { "status": "step-current", "title": "기안자", "name": "계전보안부 이현경" },
                                            { "status": "step-default", "title": "제어보호담당자", "name": "계전보안부 오승환" },
                                            { "status": "step-default", "title": "제어보호담당관", "name": "계전보안부 김현수" }]'></div>
                                        <script type="module" src="../../../assets/js/components/step.js"></script>
                                        <!-- step end -->
                                    </div>
                                    <!--// 결재상태 -->
                                </div>

                                <div class="approve-sec type01">
                                    <div class="title-wrap" data-title="결재진행" data-heading="h6"></div>
                                    <!-- input form -->
                                    <div class="input-form-area">
                                        <!-- form start -->
                                        <form>
                                            <fieldset>
                                                <!-- form-wrap start -->
                                                <div class="form-wrap type02">
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">제어보호담당관</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center">김현수</div>
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">결재일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center"></div>
                                                            </div>
                                                            <div class="form-group">
                                                                <!-- badge 영역 -->
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">제어보호담당자</div>
                                                            <div class="form-group">
                                                                <!-- input search group start -->
                                                                <div class="input-search-group">
                                                                    <input type="search" class="form-control" id="search1" value="오승환" placeholder="제어보호담당자 입력">
                                                                    <label class="input-group-text" for="search1"><i class="icon search"></i></label>
                                                                </div>
                                                                <!--// input search group end -->
                                                                <!-- 에러 문구 -->
                                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                                <!--// 에러 문구 -->
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">결재일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center"><!--  --></div>
                                                            </div>
                                                            <div class="form-group">
                                                                <!-- badge 영역 -->
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">기안자</div>
                                                            <div class="form-group">
                                                                <!-- input search group start -->
                                                                <div class="input-search-group">
                                                                    <input type="search" class="form-control" id="search1" value="이현경" placeholder="관리부서 차(팀)장 입력">
                                                                    <label class="input-group-text" for="search1"><i class="icon search"></i></label>
                                                                </div>
                                                                <!--// input search group end -->
                                                                <!-- 에러 문구 -->
                                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                                <!--// 에러 문구 -->
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">기안일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center"><!--  -->2024.12.12 11:30</div>
                                                            </div>
                                                            <div class="form-group">
                                                                <!-- badge 영역 -->
                                                                <div class="input-badge-group center">
                                                                    <span class="badge badge-type01">기완완료</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!--// row end-->
                                                </div>
                                                <!--// form-wrap end -->
                                            </fieldset>
                                        </form>
                                        <!-- form end -->
                                    </div>
                                    <!--// input form -->
                                </div>

                            </div>
                            <!--// 결재 컴퍼넌트 영역 -->
                            <!-- bottom button area start -->
                            <div class="bottom-btn-area" 
                                data-buttons='[{"text": "회수"}, {"text": "결재"}]'>
                            </div>
                            <!--// bottom button area end -->
                        </div>
                    </article>
                    <!--// 결재정보 -->
                </div>
                <!--// 팝업 컨텐츠 영역 -->
            </div>
        </section>
        <!--// 팝업 컨테이너 영역 -->
    </div>
    <!-- script wrap -->
    <script type="module">
        const rowData = [
            {
                field01: "클릭하면 수정 가능",
                field02: "시스템 명",
                field03: "클릭하면 수정 가능",
                field04: "클릭하면 수정 가능",
                field05: "2025-01-20",
                field06: "클릭하면 수정 가능",
                field07: "2025-01-20",
                field08: "",
                field09: "",
                field10: "2025-01-20",
                field11: "",
                field12: "step01",
            },
            {
                field01: "클릭하면 수정 가능",
                field02: "시스템 명",
                field03: "클릭하면 수정 가능",
                field04: "",
                field05: "",
                field06: "",
                field07: "",
                field08: "",
                field09: "",
                field10: "",
                field11: "",
                field12: "done",
            },
        ];
        const columnDefs = [
            {
                headerName: "자산관리번호",
                headerClass: "center",
                field: "field01",
                width: 238,
                cellClass: "cell-normal",
                cellEditor: 'customInputSearchEditor',
            },
            {
                headerName: "시스템 명",
                headerClass: "center",
                field: "field02",
                width: 180,
                cellClass: "cell-normal",
            },
            {
                headerName: "계정",
                headerClass: "center",
                field: "field03",
                width: 180,
                cellClass: "cell-normal",
            },
            {
                headerName: "비밀번호",
                headerClass: "center",
                field: "field04",
                width: 180,
                cellClass: "cell-normal",
            },
            {
                headerName: "비밀번호 변경일자",
                headerClass: "center",
                field: "field05",
                width: 180,
                cellClass: "cell-normal",
                cellEditorSelector: function(params) {
                    return {
                        component: 'bootstrapDatePickerEditor'
                    };
                }
            },
            {
                headerName: "계정 접근권한",
                headerClass: "center",
                field: "field06",
                width: 180,
                cellClass: "cell-normal",
                cellEditor: 'agTextCellEditor',
                cellEditorParams: {
                    maxLength: 20
                },
            },
            {
                headerName: "계정 등록일",
                headerClass: "center",
                field: "field07",
                width: 180,
                cellClass: "cell-normal",
                cellEditorSelector: function(params) {
                    return {
                        component: 'bootstrapDatePickerEditor'
                    };
                }
            },
            {
                headerName: "계정 공유",
                headerClass: "center",
                field: "field08",
                width: 180,
                cellClass: "cell-normal",
            },
            {
                headerName: "IP",
                headerClass: "center",
                field: "field09",
                width: 180,
                cellClass: "cell-normal",
            },
            {
                headerName: "일자",
                headerClass: "center",
                field: "field10",
                width: 180,
                cellClass: "cell-normal",
                cellEditorSelector: function(params) {
                    return {
                        component: 'bootstrapDatePickerEditor'
                    };
                }
            },
            {
                headerName: "점검자",
                headerClass: "center",
                field: "field11",
                width: 180,
                cellClass: "cell-normal",
                cellEditor: 'customInputSearchEditor',
            },
            {
                headerName: "결재 상태",
                headerClass: "center",
                field: "field12",
                minWidth: 400,
                flex: 1,
                cellClass: "cell-normal",
                cellRenderer: (params) => {
                    const status = params.value;

                    let stepsData = [];
                    
                    if (status === "step01") {
                        stepsData = [
                            { "status": "step-current", "title": "기안자", "name": "박동원" },
                            { "status": "step-default", "title": "제어보호담당자", "name": "오승환" },
                            { "status": "step-default", "title": "제어보호담당자", "name": "김현수" }
                        ];
                    } else if (status === "step02") {
                        stepsData = [
                            { "status": "step-done", "title": "기안자", "name": "박동원" },
                            { "status": "step-current", "title": "제어보호담당자", "name": "오승환" },
                            { "status": "step-default", "title": "제어보호담당관", "name": "김현수" }
                        ];
                    } else if (status === "done") {
                        stepsData = [
                            { "status": "step-done", "title": "기안자", "name": "박동원" },
                            { "status": "step-done", "title": "제어보호담당자", "name": "오승환" },
                            { "status": "step-done", "title": "제어보호담당관", "name": "김현수" }
                        ];
                    }

                    let stepListHtml = '<ul class="step-list">';
                        
                    stepsData.forEach(step => {
                        stepListHtml += `
                            <li class="${step.status}">
                                <dl>
                                    <dt><i class="step-img"></i></dt>
                                    <dd class="txt">${step.title}</dd>
                                    <dd class="txt">${step.name}</dd>
                                </dl>
                            </li>
                        `;
                    });
                    stepListHtml += '</ul>';
                    return `<div class="step step-sm">${stepListHtml}</div>`;
                }
            }
        ];
        let sampleGridApi;

        const sampleGridOptions = {
            defaultColDef: {
                editable: true, // edit 사용 유무
                autoHeight: true,
                sortable: true, // sort 사용 유무
            },
            columnDefs,
            headerHeight: 41, // header height
            rowData: rowData,
            rowHeight: 56, // row height
            rowSelection: { // row checkbox
                mode: "multiRow",
                groupSelects: "descendants",
                selectAll: 'filtered',
                width: 52,
            },
            domLayout: "autoHeight",
            suppressColumnVirtualisation: true,
            components: {
                bootstrapDatePickerEditor: function() {
                    return {
                        init: function(params) {
                            const input = document.createElement('input');
                            input.type = 'text';
                            input.className = 'form-control datepicker';
                            input.value = params.value || '';
                            input.placeholder = "YYYY-MM-DD";

                            const label = document.createElement('label');
                            label.className = 'input-group-text';
                            label.innerHTML = '<i class="icon calendar"></i>';

                            input.addEventListener('input', function() {
                                params.api.stopEditing();
                            });
                            
                            const wrapper = document.createElement('div');
                            wrapper.className = 'input-date-group';
                            wrapper.appendChild(input);
                            wrapper.appendChild(label);
                            this.eWrapper = wrapper;

                            $(input).datepicker({
                                format: 'mm/dd/yyyy',
                                autoclose: true
                            });
                            input.value = params.value;

                            input.addEventListener('change', function() {
                                params.api.stopEditing();
                            });

                            this.eInput = input;
                        },
                        getValue: function() {
                            return this.eInput.value;
                        },
                        getGui: function() {
                            return this.eInput;
                        }
                    };
                },
                customInputSearchEditor: function() {
                    return {
                        init: function(params) {
                            
                            const input = document.createElement('input');
                            input.type = 'search';
                            input.className = 'form-control';
                            input.value = params.value || '';
                            input.placeholder = "입력";

                            const label = document.createElement('label');
                            label.className = 'input-group-text';
                            label.innerHTML = '<i class="icon search"></i>';

                           
                            input.addEventListener('input', function() {
                                params.api.stopEditing();
                            });

                            this.eInput = input;
                            this.eLabel = label;

                            const wrapper = document.createElement('div');
                            wrapper.className = 'input-search-group';
                            wrapper.appendChild(input);
                            wrapper.appendChild(label);
                            this.eWrapper = wrapper;
                        },
                        getValue: function() {
                            return this.eInput.value;
                        },
                        getGui: function() {
                            return this.eWrapper;
                        }
                    };
                },
            },

            // data empty style
            overlayNoRowsTemplate: '<div class="empty"><div class="empty-img"></div><div class="empty-txt">데이타가 없습니다.</div></div>',
        };
        const sampleGridDiv = document.querySelector("#sampleGrid");
        sampleGridApi = agGrid.createGrid(sampleGridDiv, sampleGridOptions);
    </script>
    <!--// script wrap -->
</body>
</html>
