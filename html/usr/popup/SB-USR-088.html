<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <link rel="icon" href="../../../assets/favicon.svg" type="image/x-icon">
    <!-- css -->
    <link rel="stylesheet" href="../../../css/agGrid.css">
    <link rel="stylesheet" href="../../../css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="../../../css/bootstrap-treeview.min.css">
    <link rel="stylesheet" href="../../../css/style.css?v=20250616"><!-- 버전 관리 적용 -->
    <!-- script -->
    <script src="../../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../../assets/js/common.js"></script>
</head>
<body>
    <div id="pop-wrap" class="kdhc-pop-wrap">
        <header class="kdhc-pop-header">
            <h1 class="pop-title">자산관리결재</h1>
            <button type="button" class="btn-close" aria-label="Close" onclick="window.close()"></button>
        </header>
        <!-- 팝업 컨테이너 영역 -->
        <section class="kdhc-pop-container">
            <div class="inner">
                <!-- 팝업 컨텐츠 영역 -->
                <div class="contents">
                    <!-- breadcrumbs start -->
                    <nav id="breadcrumb" class="breadcrumb-wrap" aria-label="breadcrumb" 
                        data-breadcrumb='[
                        { "name": "정보자산", "url": "#" },
                        { "name": "자산관리", "url": "#" },
                        { "name": "자산관리결재", "url": "", "active": true }
                        ]' data-visible="true">
                    </nav>
                    <!--// breadcrumbs end -->

                    <!-- 자산결재관리-->
                    <article class="section">
                        <div class="input-form-area">
                            <table class="tbl-input-form">
                                <caption>항목변경</caption>
                                <colgroup>
                                    <col width="10%" />
                                    <col width="30%" />
                                    <col width="30%" />
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th>항목구분</th>
                                        <th>변경전</th>
                                        <th>변경후</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <th>등급</th>
                                        <td class="center">중</td>
                                        <td class="center">상</td>
                                    </tr>
                                    <tr>
                                        <th>자산위치</th>
                                        <td class="center"></td>
                                        <td class="center"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </article>
                    <!--// 자산결재관리 -->

                    <!-- 결재정보 -->
                    <article class="section">

                        <!-- section tit start -->
                        <div class="title-wrap" data-title="결재정보" data-heading="h3"></div>
                        <!--// section tit end -->

                        <div class="section-sub">
                            <!-- 결재 컴퍼넌트 영역 -->
                            <div class="approve">

                                <div class="approve-sec">
                                    <div class="title-wrap" data-title="결재정보" data-heading="h6"></div>
                                    <!-- input form -->
                                    <div class="input-form-area">
                                        <!-- form start -->
                                        <form>
                                            <fieldset>
                                                <!-- form-wrap start -->
                                                <div class="form-wrap type02">
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">기안일</div>
                                                            <div class="form-group">
                                                                <div class="input-txt"><!-- 텍스트 영역 --></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!--// row end-->
                                                </div>
                                                <!--// form-wrap end -->
                                            </fieldset>
                                        </form>
                                        <!-- form end -->
                                    </div>
                                    <!--// input form -->
                                </div>

                                <div class="approve-sec">
                                    <div class="title-wrap" data-title="결재상태" data-heading="h6"></div>
                                    <!-- 결재상태 -->
                                    <div class="process-status">
                                        <!-- step start -->
                                        <div id="step-container" class="step step-lg" data-step='[
                                            { "status": "step-done", "title": "기안자", "name": "계전보안부 이현경" },
                                            { "status": "step-done", "title": "관리부서 차(팀)장", "name": "계전보안부 최원태" },
                                            { "status": "step-done", "title": "제어보호담당자", "name": "계전보안부 오승환" },
                                            { "status": "step-done", "title": "제어보호담당관", "name": "계전보안부 김현수" }]'></div>
                                        <script type="module" src="../../../assets/js/components/step.js"></script>
                                        <!--// step end -->
                                    </div>
                                    <!--// 결재상태 -->
                                </div>

                                <div class="approve-sec type01">
                                    <div class="title-wrap" data-title="결재진행" data-heading="h6"></div>
                                    <!-- input form -->
                                    <div class="input-form-area">
                                        <!-- form start -->
                                        <form>
                                            <fieldset>
                                                <!-- form-wrap start -->
                                                <div class="form-wrap type02">
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">제어보호담당관</div>
                                                            <div class="form-group">
                                                                <div class="input-txt">김현수</div>    
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">결재일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center">2024.12.12 11:30:24</div>
                                                            </div>
                                                            <div class="form-group">
                                                                <div class="input-badge-group center">
                                                                    <span class="badge badge-type01">결재완료</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">제어보호담당자</div>
                                                            <div class="form-group">
                                                                <!-- input-search-group is-error -->
                                                                <div class="input-search-group">
                                                                    <input type="search" class="form-control" id="search1" value="오승환" placeholder="입력">
                                                                    <label class="input-group-text" for="search1"><i class="icon search"></i></label>
                                                                </div>
                                                                <!--// input search group -->
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">결재일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center">2024.12.12 11:30:24</div>
                                                            </div>
                                                            <div class="form-group">
                                                                <div class="input-badge-group center">
                                                                    <span class="badge badge-type01">결재완료</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">기안자</div>
                                                            <div class="form-group">
                                                                <!-- input-search-group is-error -->
                                                                <div class="input-search-group">
                                                                    <input type="search" class="form-control" id="search1" value="이현경" placeholder="입력">
                                                                    <label class="input-group-text" for="search1"><i class="icon search"></i></label>
                                                                </div>
                                                                <!--// input search group -->
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">기안일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center">2024.12.12 11:30:24</div>
                                                            </div>
                                                            <div class="form-group">
                                                                <div class="input-badge-group center">
                                                                    <span class="badge badge-type01">기완완료</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!--// row end-->
                                                </div>
                                                <!--// form-wrap end -->
                                            </fieldset>
                                        </form>
                                        <!-- form end -->
                                    </div>
                                    <!--// input form -->
                                </div>

                            </div>
                            <!--// 결재 컴퍼넌트 영역 -->
                            <!-- bottom button area start -->
                            <div class="bottom-btn-area" 
                                data-buttons='[{"text": "회수"}, {"text": "결재"}]'>
                            </div>
                            <!--// bottom button area end -->
                        </div>
                    </article>
                    <!--// 결재정보 -->
                </div>
                <!--// 팝업 컨텐츠 영역 -->
            </div>
        </section>
        <!--// 팝업 컨테이너 영역 -->
    </div>
</body>
</html>
