<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/x-icon">
    <!-- css -->
    <link rel="stylesheet" href="../../../css/index.css">
    <!-- script -->
    <script src="../../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../../assets/js/common.js"></script>
</head>
<body>
    <div id="pop-wrap" class="kdhc-pop-wrap">
        <header class="kdhc-pop-header">
            <h1 class="pop-title">계정로그 일일 점검내역 등록</h1>
            <button type="button" class="btn-close" aria-label="Close" onclick="window.close()"></button>
        </header>
        <!-- 팝업 컨테이너 영역 -->
        <section class="kdhc-pop-container">
            <div class="inner">
                <!-- 팝업 컨텐츠 영역 -->
                <div class="contents">
                    <!-- breadcrumbs start -->
                    <nav id="breadcrumb" class="breadcrumb-wrap" aria-label="breadcrumb" 
                        data-breadcrumb='[
                            { "name": "기술보안", "url": "#" },
                            { "name": "계정로그 일일 점검내역", "url": "#" },
                            { "name": "등록", "url": "", "active": true }
                        ]'
                        data-visible="true">
                    </nav>
                    <!--// breadcrumbs end -->

                    <!--  -->
                    <article class="section">
                        <!-- input form -->
                        <div class="input-form-area">
                            <!-- form start -->
                            <form>
                                <fieldset>
                                    <!-- form-wrap start -->
                                    <div class="form-wrap type01">
                                        <!-- row -->
                                        <div class="form-row">
                                            <!--  -->
                                            <div class="col">
                                                <div class="form-label">점검날짜</div>
                                                <div class="form-group">
                                                    <!-- datepicker : class="input-date-group is-error" -->
                                                    <div class="input-date-group w-50">
                                                        <input type="text" id="singleDate0" class="form-control datepicker" value=""
                                                            placeholder="YYYY-MM-DD">
                                                        <label class="input-group-text" for="singleDate0"><i class="icon calendar"></i></label>
                                                    </div>
                                                    <!--// datepicker -->
                                                    <!-- 에러 문구 : hidden 제거 -->
                                                    <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                    <!--// 에러 문구 -->
                                                </div>
                                            </div>
                                            <!--  -->
                                        </div>
                                        <!--// row end -->
                                    </div>
                                    <!--// form-wrap end -->
                                </fieldset>
                            </form>
                            <!-- form end -->
                        </div>
                        <!--// input form -->
                    </article>
                    <article class="section">
                       
                        <!-- grid top start -->
                        <article class="grid-top-area">
                            <!-- grid top button start -->
                            <div class="grid-top-btn" data-buttons='[{"text": "행추가"}, {"text": "임시저장"}]'>
                            </div>
                            <!--// grid top button end -->
                        </article>
                        <!--// grid top end -->

                        <!-- grid wrap start -->
                        <article class="grid-wrap">
                            <div id="sampleGrid" class="normal row-merge-grid"></div>
                        </article>
                        <!--// grid wrap end -->
                    </article>
                    <!--//  -->
                    <!-- 결재정보 -->
                    <article class="section">

                        <!-- section tit start -->
                        <div class="title-wrap" data-title="결재정보" data-heading="h3"></div>
                        <!--// section tit end -->

                        <div class="section-sub">
                            <!-- 결재 컴퍼넌트 영역 -->
                            <div class="approve">

                                <div class="approve-sec">
                                    <div class="title-wrap" data-title="결재정보" data-heading="h6"></div>
                                    <!-- input form -->
                                    <div class="input-form-area">
                                        <!-- form start -->
                                        <form>
                                            <fieldset>
                                                <!-- form-wrap start -->
                                                <div class="form-wrap type02">
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">기안일</div>
                                                            <div class="form-group">
                                                                <div class="input-txt"><!-- 텍스트 영역 --></div>
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">결재 명</div>
                                                            <div class="form-group">
                                                                <div class="input-txt"><!-- 텍스트 영역 --></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!--// row end-->
                                                </div>
                                                <!--// form-wrap end -->
                                            </fieldset>
                                        </form>
                                        <!-- form end -->
                                    </div>
                                    <!--// input form -->
                                </div>

                                <div class="approve-sec">
                                    <div class="title-wrap" data-title="결재상태" data-heading="h6"></div>
                                    <!-- 결재상태 -->
                                    <div class="process-status">
                                        <!-- step start -->
                                        <div id="step-container" class="step step-lg" data-step='[
                                            { "status": "step-current", "title": "기안자", "name": "계전보안부 이현경" },
                                            { "status": "step-default", "title": "제어보호담당자", "name": "계전보안부 오승환" },
                                            { "status": "step-default", "title": "제어보호담당관", "name": "계전보안부 김현수" }]'></div>
                                        <script type="module" src="../../../assets/js/components/step.js"></script>
                                        <!-- step end -->
                                    </div>
                                    <!--// 결재상태 -->
                                </div>

                                <div class="approve-sec type01">
                                    <div class="title-wrap" data-title="결재진행" data-heading="h6"></div>
                                    <!-- input form -->
                                    <div class="input-form-area">
                                        <!-- form start -->
                                        <form>
                                            <fieldset>
                                                <!-- form-wrap start -->
                                                <div class="form-wrap type02">
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">제어보호담당관</div>
                                                            <div class="form-group">
                                                                <div class="input-txt">김현수</div>
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">결재일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center"></div>
                                                            </div>
                                                            <div class="form-group">
                                                                <!-- badge 영역 -->
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">제어보호담당자</div>
                                                            <div class="form-group">
                                                                <!-- input-search-group is-error -->
                                                                <div class="input-search-group">
                                                                    <input type="search" class="form-control" id="search1" value="오승환" placeholder="제어보호담당자 입력">
                                                                    <label class="input-group-text" for="search1"><i class="icon search"></i></label>
                                                                </div>
                                                                <!--// input search group -->
                                                                <!-- 에러 문구 :  hidden 제거 -->
                                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                                <!--// 에러 문구 -->
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">결재일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center"><!--  --></div>
                                                            </div>
                                                            <div class="form-group">
                                                                <!-- badge 영역 -->
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">기안자</div>
                                                            <div class="form-group">
                                                                <!-- input-search-group is-error -->
                                                                <div class="input-search-group">
                                                                    <input type="search" class="form-control" id="search1" value="이현경" placeholder="관리부서 차(팀)장 입력">
                                                                    <label class="input-group-text" for="search1"><i class="icon search"></i></label>
                                                                </div>
                                                                <!--// input search group -->
                                                                <!-- 에러 문구 :  hidden 제거 -->
                                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                                <!--// 에러 문구 -->
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">기안일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center"><!--  -->2024.12.12 11:30</div>
                                                            </div>
                                                            <div class="form-group">
                                                                <!-- badge 영역 -->
                                                                <div class="input-badge-group center">
                                                                    <span class="badge badge-type01">기완완료</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!--// row end-->
                                                </div>
                                                <!--// form-wrap end -->
                                            </fieldset>
                                        </form>
                                        <!-- form end -->
                                    </div>
                                    <!--// input form -->
                                </div>

                            </div>
                            <!--// 결재 컴퍼넌트 영역 -->
                            <!-- bottom button area start -->
                            <div class="bottom-btn-area" 
                                data-buttons='[{"text": "회수"}, {"text": "결재"}]'>
                            </div>
                            <!--// bottom button area end -->
                        </div>
                    </article>
                    <!--// 결재정보 -->
                </div>
                <!--// 팝업 컨텐츠 영역 -->
            </div>
        </section>
        <!--// 팝업 컨테이너 영역 -->
    </div>
    <!-- script wrap -->

    <script type="module">
        import { bootstrapDatePickerEditor } from "../../../assets/js/components/agGridComponents.js"
        
        const rowData = [
            { field01: "1", field02: "", field03: "분산제어", field04: "", field05: "", field06: "", field07: "" },
            { field01: "1", field02: "", field03: "발전제어", field04: "", field05: "", field06: "", field07: "" },
            { field01: "1", field02: "", field03: "전력제어", field04: "", field05: "", field06: "", field07: "" },
            { field01: "1", field02: "", field03: "보조제어", field04: "", field05: "", field06: "", field07: "" },
            { field01: "2", field02: "", field03: "전력제어", field04: "", field05: "", field06: "", field07: "" },
            { field01: "2", field02: "", field03: "보조제어", field04: "", field05: "", field06: "", field07: "" },
            { field01: "3", field02: "", field03: "보조제어", field04: "", field05: "", field06: "", field07: "" },
            { field01: "4", field02: "", field03: "보조제어1", field04: "", field05: "", field06: "", field07: "" },
            { field01: "4", field02: "", field03: "보조제어2", field04: "", field05: "", field06: "", field07: "" },
            { field01: "4", field02: "", field03: "보조제어3", field04: "", field05: "", field06: "", field07: "" },
            { field01: "5", field02: "", field03: "보조제어3", field04: "", field05: "", field06: "", field07: "" },
            { field01: "6", field02: "", field03: "보조제어3", field04: "", field05: "", field06: "", field07: "" },
            { field01: "6", field02: "", field03: "보조제어3", field04: "", field05: "", field06: "", field07: "" },
        ];
        const columnDefs = [
            {
                headerName: "순번",
                headerClass: "center",
                field: "field01",
                width: 64,
                rowSpan: (params) => shouldMergeRows(params, ["field01", "field05", "field06"]),
                cellClass: getMergeCellClass,
                
            },
            {
                headerName: "점검일",
                headerClass: "center",
                field: "field02",
                width: 180,
                cellClass: "cell-normal input",
                editable: true,
                cellEditor: 'bootstrapDatePickerEditor',
                cellRenderer: (params) => {
                    const value = params.value;
                    
                    if (!value) {
                        return `
                            <div class="input-date-group">
                                <input type="text" id="singleDate" class="form-control datepicker" value="" placeholder="YYYY-MM-DD">
                                <label class="input-group-text" for="singleDate"><i class="icon calendar"></i></label>
                            </div>
                        `;
                    } else {
                        return value;
                    }
                }
            },
            {
                headerName: "점검항목",
                headerClass: "center",
                field: "field03",
                minWidth: 180,
                flex: 1,
                cellClass: "cell-normal",
            },
            {
                headerName: "이상유무(O,X)",
                headerClass: "center",
                field: "field04",
                width: 180,
                editable: false,
                cellClass: "cell-normal input",
                cellRenderer: (params) => {
                    const value = params.value;

                    if (!value) {
                        return `
                        <!-- select-group is-error -->
                            <div class="select-group">
                                <select class="form-select" aria-label="Default select">
                                    <option value="" selected>선택</option>
                                    <option value="O">O</option>
                                    <option value="X">X</option>
                                </select>
                            </div>
                            <!--// select-group -->
                        `;
                    } else {
                        return value;
                    }
                }
            },
            {
                headerName: "점검결과",
                headerClass: "center",
                field: "field05",
                minWidth: 180,
                flex: 1,
                editable: false,
                rowSpan: (params) => shouldMergeRows(params, ["field01", "field05", "field06"]),
                cellClass: getMergeCellClass,
                cellRenderer: (params) => createRegisterButton(params, "field05")
            },
            {
                headerName: "조치사항",
                headerClass: "center",
                field: "field06",
                minWidth: 180,
                flex: 1,
                editable: false,
                rowSpan: (params) => shouldMergeRows(params, ["field01", "field05", "field06"]),
                cellClass: getMergeCellClass,
                cellRenderer: (params) => createRegisterButton(params, "field06")
            },
            {
                headerName: "삭제",
                headerClass: "center",
                field: "field07",
                width: 100,
                cellClass: "cell-normal",
                cellRenderer: params => {
                    return '<button type="button" class="btn btn-icon"><i class="icon del-trash" /></button>';
                }
            },
        ];

        
        // rowspan start
        let rowspanMap = {};

        function calculateRowspanMap(data, fields) {
            const mapKey = fields.join(",");
            rowspanMap[mapKey] = {};

            let rowIndex = 0;

            while (rowIndex < data.length) {
                let mergeCount = 1;
                const key = fields.map(field => data[rowIndex][field]).join(",");

                for (let i = rowIndex + 1; i < data.length; i++) {
                    const nextKey = fields.map(field => data[i][field]).join(",");
                    if (nextKey === key) {
                        mergeCount++;
                    } else {
                        break;
                    }
                }

                for (let i = 0; i < mergeCount; i++) {
                    if (i > 0) {
                        fields.forEach(field => {
                            data[rowIndex + i][field] = "";
                        });
                    }
                    rowspanMap[mapKey][rowIndex + i] = i === 0 ? mergeCount : 0;
                }

                rowIndex += mergeCount;
            }
        }

        function shouldMergeRows(params, fields) {
            const mapKey = fields.join(",");
            const rowIndex = params.node.rowIndex;
            return rowspanMap[mapKey]?.[rowIndex] || 1;
        }

        function getMergeCellClass(params) {
            const mapKey = ["field01", "field05", "field06"].join(",");
            const rowIndex = params.node.rowIndex;
            
            if (rowspanMap[mapKey]?.[rowIndex] > 1) {
                return "merge-cell";
            } else if (rowspanMap[mapKey]?.[rowIndex] === 0) {
                return "blank";
            }
            return "cell-normal";
        }

        function getRowHeight(params) {
            const mapKey = ["field01", "field05", "field06"].join(",");
            const rowIndex = params.node.rowIndex;
            return rowspanMap[mapKey]?.[rowIndex] > 1 ? 63 * rowspanMap[mapKey][rowIndex] : 63;
        }

        // rowspan end

        // 등록 버튼 생성
        function createRegisterButton(params, field) {
            const rowIndex = params.node.rowIndex;
            const mapKey = ["field01", "field05", "field06"].join(",");
            
            const currentRowspan = rowspanMap[mapKey]?.[rowIndex] || 1;
            const prevRowspan = rowspanMap[mapKey]?.[rowIndex - 1] || 1;

            const isFirstMergedRow = currentRowspan > 1 && (rowIndex === 0 || prevRowspan === 1);

            if (isFirstMergedRow || currentRowspan === 1) {
                return `
                    <button type="button" class="btn btn-grid register-btn" data-row-index="${rowIndex}" data-field="${field}">
                        등록
                    </button>
                `;
            }
            return "";
        }
        // 등록 버튼 생성 end

        // popup
        document.addEventListener("click", (event) => {
            const button = event.target.closest(".register-btn");
            if (!button) return;

            const rowIndex = button.dataset.rowIndex;
            const field = button.dataset.field;
            
            const isInspectionResult = field === "field05";
            const popupUrl = isInspectionResult ? "./SB-USR-057_02.html" : "./SB-USR-057_03.html";

            const width = 600;
            const height = 300;
            const left = (window.screenLeft || window.screenX) + (window.innerWidth - width) / 2;
            const top = (window.screenTop || window.screenY) + (window.innerHeight - height) / 2;

            window.open(
                popupUrl,
                "PopupWindow",
                `width=${width},height=${height},left=${left},top=${top},scrollbars=yes,resizable=yes`
            );
        });
        // popup end

        let sampleGridApi;

        const sampleGridOptions = {
        defaultColDef: {
            editable: false, // edit 사용 유무
            autoHeight: true,
            sortable: false, // sort 사용 유무
        },
        columnDefs,
        headerHeight: 41, // header height
        rowData: rowData,
        rowHeight: 63, // row height

        onGridReady: (params) => { // merge option
            calculateRowspanMap(rowData, ["field01", "field05", "field06"]);
            params.api.refreshCells({ force: true });
            params.api.redrawRows();
        },
        getRowHeight: (params) => 63,
        domLayout: "autoHeight",
        suppressColumnVirtualisation: false,
        suppressRowTransform: true, // merge option 추가
        components: {
            bootstrapDatePickerEditor
        },
        // data empty style
        overlayNoRowsTemplate: '<div class="empty"><div class="empty-img"></div><div class="empty-txt">데이타가 없습니다.</div></div>',
        };

        const sampleGridDiv = document.querySelector("#sampleGrid");
        sampleGridApi = agGrid.createGrid(sampleGridDiv, sampleGridOptions);
    </script>
    
    <!--// script wrap -->
</body>
</html>
