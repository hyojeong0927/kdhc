</head>

<body>
    <div id="pop-wrap" class="kdhc-pop-wrap">

                <div class="contents">
                    <!-- breadcrumbs start -->

                        { "name": "보안정책", "url": "#" },
                        { "name": "보안패치 미운영 월간 점검", "url": "../usr/SB-USR-051.html" },
                        { "name": "보안패치 미운영 월간 점검 등록", "url": "", "active": true }
                        ]' data-visible="true">
                    </nav>
                    <!--// breadcrumbs end -->

                    <!-- 기본정보 -->
                    <article class="section">
                        
                        <!-- input form -->
                        <div class="input-form-area">
                            <!-- form start -->
                            <form>
                                <fieldset>
                                    <!-- form-wrap start -->
                                    <div class="form-wrap type02">
                                        <!-- row -->
                                        <div class="form-row">
                                            <!--  -->
                                            <div class="col">
                                                <div class="form-label">점검일</div>
                                                <div class="form-group">
                                                    <!-- input-date-group -->
                                                    <div class="input-date-group">

                                                    <!--// input-date-group -->

                                            </div>
                                            <!--  -->
                                            <div class="col">
                                                <div class="form-label">월</div>
                                                <div class="form-group">
                                                    <!-- select-group is-error : 에러일 경우 -->
                                                    <div class="select-group">
                                                        <select class="form-select" aria-label="Default select" required>
                                                            <option value="" selected>선택</option>

                                                            <option value="2">Two</option>

                                                    </div>

                                                    <!--// 에러 문구 -->
                                                </div>
                                            </div>
                                            <!--  -->
                                        </div>
                                        <!--// row end -->
                                    </div>
                                    <!--// form-wrap end -->
                                </fieldset>
                            </form>
                            <!-- form end -->
                        </div>
                        <!--// input form -->
                    </article>
                    <!--// 기본정보 -->

                    <!-- 설치 프로그램 -->
                    <div class="section">
                        <!-- grid top start -->
                        <article class="grid-top-area">
                            <!-- grid top button start -->
                            <div class="grid-top-btn" data-buttons='[{"text": "행추가"}]'>
                            </div>
                            <!--// grid top button end -->
                        </article>
                        <!--// grid top end -->
                        
                        <!-- grid wrap start -->

                    <!--// 설치 프로그램 -->

                    <!-- 결재정보 -->
                    <article class="section">

                        <!-- section tit start -->
                        <div class="title-wrap" data-title="결재정보" data-heading="h3"></div>
                        <!--// section tit end -->

                        <div class="section-sub">
                            <!-- 결재 컴퍼넌트 영역 -->
                            <div class="approve">

                                <div class="approve-sec">
                                    <div class="title-wrap" data-title="결재정보" data-heading="h6"></div>
                                    <!-- input form -->
                                    <div class="input-form-area">
                                        <!-- form start -->
                                        <form>
                                            <fieldset>
                                                <!-- form-wrap start -->
                                                <div class="form-wrap type02">
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">기안일</div>
                                                            <div class="form-group">
                                                                <div class="input-txt"><!-- 텍스트 영역 --></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!--// row end-->
                                                </div>
                                                <!--// form-wrap end -->
                                            </fieldset>
                                        </form>
                                        <!-- form end -->
                                    </div>
                                    <!--// input form -->
                                </div>

                                <div class="approve-sec">
                                    <div class="title-wrap" data-title="결재상태" data-heading="h6"></div>
                                    <!-- 결재상태 -->
                                    <div class="process-status">
                                        <!-- step start -->
                                        <div id="step-container" class="step step-lg" data-step='[
                                            { "status": "step-done", "title": "기안자", "name": "계전보안부 이현경" },
                                            { "status": "step-current", "title": "제어보호담당자", "name": "계전보안부 오승환" },
                                            { "status": "step-default", "title": "제어보호담당관", "name": "계전보안부 김현수" },
                                            { "status": "step-reject", "title": "제어보호담당관", "name": "계전보안부 김현수" }]'>
                                            
                                        </div>
                                        <script type="module" src="../../../assets/js/components/step.js"></script>
                                        <!-- step end -->
                                    </div>
                                    <!--// 결재상태 -->
                                </div>

                                <div class="approve-sec type01">
                                    <div class="title-wrap" data-title="결재진행" data-heading="h6"></div>
                                    <!-- input form -->
                                    <div class="input-form-area">
                                        <!-- form start -->
                                        <form>
                                            <fieldset>
                                                <!-- form-wrap start -->
                                                <div class="form-wrap type02">
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">제어보호담당관</div>
                                                            <div class="form-group">
                                                                <div class="input-txt">김현수</div>
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">결재일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center">2024.12.12 11:30:24</div>
                                                            </div>
                                                            <div class="form-group">
                                                                <!-- badge 영역 -->
                                                                <div class="input-badge-group center">
                                                                    <span class="badge badge-type02">결재반려</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">제어보호담당자</div>
                                                            <div class="form-group">
                                                                <!-- input-search-group is-error -->
                                                                <div class="input-search-group">
                                                                    <input type="search" class="form-control"
                                                                        id="search1" value="오승환"
                                                                        placeholder="제어보호담당자 입력">
                                                                    <label class="input-group-text" for="search1"><i
                                                                            class="icon search"></i></label>
                                                                </div>
                                                                <!--// input search group -->
                                                                <!-- 에러 문구 :  hidden 제거 -->
                                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                                <!--// 에러 문구 -->
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">결재일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center"><!--  --></div>
                                                            </div>
                                                            <div class="form-group">
                                                                <!-- badge 영역 -->
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">기안자</div>
                                                            <div class="form-group">
                                                                <!-- input-search-group is-error -->
                                                                <div class="input-search-group">
                                                                    <input type="search" class="form-control"
                                                                        id="search1" value="이현경"
                                                                        placeholder="관리부서 차(팀)장 입력">
                                                                    <label class="input-group-text" for="search1"><i
                                                                            class="icon search"></i></label>
                                                                </div>
                                                                <!--// input search group -->
                                                                <!-- 에러 문구 :  hidden 제거 -->
                                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                                <!--// 에러 문구 -->
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">기안일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center">2024.12.12 11:30:24</div>
                                                            </div>
                                                            <div class="form-group">
                                                                <!-- badge 영역 -->
                                                                <div class="input-badge-group center">
                                                                    <span class="badge badge-type01">기완완료</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!--// row end-->
                                                </div>
                                                <!--// form-wrap end -->
                                            </fieldset>
                                        </form>
                                        <!-- form end -->
                                    </div>
                                    <!--// input form -->
                                </div>

                            </div>
                            <!--// 결재 컴퍼넌트 영역 -->
                            <!-- bottom button area start -->
                            <div class="bottom-btn-area" data-buttons='[{"text": "회수"}, {"text": "결재"}]'>
                            </div>
                            <!--// bottom button area end -->
                        </div>
                    </article>
                    <!--// 결재정보 -->
                </div>
                <!--// 팝업 컨텐츠 영역 -->
            </div>
        </section>
        <!--// 팝업 컨테이너 영역 -->
    </div>
    <!-- script wrap -->
    <script type="module">
        const rowData = [
            {
                field01: "",
                field02: "분산제어시스템(DCS)",
                field03: "화성-노트북-001",
                field04: "시스템 1",
                field05: "Window 11",
                field06: "2020-10-10",
                field07: "",
                field08: "",
                field09: "",
                field10: "",
                field11: "",
                field12: "",
                field13: "",
            },
        ];
        const columnDefs = [
            {
                headerName: "순번",
                headerClass: "center",
                field: "field01",
                width: 100,
                cellClass: "cell-normal",
                valueGetter: "node.rowIndex + 1"
            },
            {
                headerName: "분류",
                headerClass: "center",
                field: "field02",
                width: 225,
                cellClass: "cell-normal",
            },
            {
                headerName: "자산관리번호",
                headerClass: "center",
                field: "field03",
                width: 225,
                cellClass: "cell-normal",
            },
            {
                headerName: "시스템 명",
                headerClass: "center",
                field: "field04",
                width: 180,
                cellClass: "cell-normal",
            },
            {
                headerName: "운영체제",
                headerClass: "center",
                field: "field05",
                width: 180,
                cellClass: "cell-normal",
            },
            {
                headerName: "도입연월",
                headerClass: "center",
                field: "field06",
                width: 120,
                cellClass: "cell-normal",
            },
            {
                headerName: "프로세스 점검결과",
                headerClass: "center",
                field: "field07",
                minWidth: 180,
                flex: 1,
                cellClass: "cell-normal input",
                cellRenderer: (params) => {
                    const value = params.value;
                    if (!value) {
                        return `
                            <!-- input-group is-error -->
                            <div class="input-group">
                                <input type="text" class="form-control" placeholder="프로세스 점검결과">
                                <label class="hidden">프로세스 점검결과</label>
                            </div>
                            <!--// input group -->
                        `;
                    } else {
                        return value;
                    }
                }
            },
            {
                headerName: "서비스 점검결과",
                headerClass: "center",
                field: "field08",
                minWidth: 180,
                flex: 1,
                cellClass: "cell-normal input",
                cellRenderer: (params) => {
                    const value = params.value;

                    if (!value) {
                        return `
                            <!-- input-group is-error -->
                            <div class="input-group">
                                <input type="text" class="form-control" placeholder="서비스 점검결과">
                                <label class="hidden">서비스 점검결과</label>
                            </div>
                            <!--// input group -->
                        `;
                    } else {
                        return value;
                    }
                }
            },
            {
                headerName: "비인가 매체 사용여부",
                headerClass: "center",
                field: "field09",
                width: 180,
                cellClass: "cell-normal input",
                cellRenderer: (params) => {
                    const value = params.value;
                    if (!value) {
                        return `
                            <!-- input-group is-error -->
                            <div class="input-group">
                                <input type="text" id="input-text" class="form-control" placeholder="입력" value="">
                                <label for="input-text" class="hidden">입력</label>
                            </div>
                            <!--// input group -->
                        `;
                    } else {
                        return value;
                    }
                }
            },
            {
                headerName: "점검일",
                headerClass: "center",
                field: "field10",
                width: 180,
                cellClass: "cell-normal input",
                editable: true,
                cellEditor: 'bootstrapDatePickerEditor',
                cellRenderer: (params) => {
                    const value = params.value;
                    if (!value) {
                        return `
                            <div class="input-date-group">
                                <input type="text" id="singleDate" class="form-control datepicker" value="" placeholder="YYYY-MM-DD">
                                <label class="input-group-text" for="singleDate"><i class="icon calendar"></i></label>
                            </div>
                        `;
                    } else {
                        return value;
                    }
                }
            },
            {
                headerName: "점검자",
                headerClass: "center",
                field: "field11",
                width: 180,
                cellClass: "cell-normal",
                editable: true,
                cellEditor: 'customInputSearchEditor',
                cellRenderer: (params) => {
                    const value = params.value;

                    if (!value) {
                        return `
                            <!-- input-search-group is-error -->
                            <div class="input-search-group">
                                <input type="search" class="form-control" id="search1" placeholder="점검자" value="">
                                <label class="input-group-text" for="search1"><i class="icon search"></i></label>
                            </div>
                            <!--// input search group -->
                        `;
                    } else {
                        return value;
                    }
                }
            },
            {
                headerName: "점검 여부",
                headerClass: "center",
                field: "field12",
                width: 120,
                cellClass: "cell-normal",
                cellEditor: 'agCheckboxCellEditor',
                cellRenderer: params => {
                    return `
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault1" ${params.value ? 'checked' : ''}>
                            <label class="form-check-label hidden" for="flexCheckDefault1">default</label>
                        </div>
                    `;
                }
            },
            {
                headerName: "삭제",
                headerClass: "center",
                field: "field14",
                width: 100,
                cellClass: "cell-normal",
                cellRenderer: params => {
                    return '<button type="button" class="btn btn-icon"><i class="icon del-trash" /></button>';
                }
            },
        ];
        
        let sampleGridApi;

        const sampleGridOptions = {
            defaultColDef: {
                editable: true, // edit 사용 유무
                autoHeight: true,
                sortable: true, // sort 사용 유무
            },
            columnDefs: columnDefs,
            headerHeight: 41, // header height
            rowData: rowData,
            rowHeight: 63, // row height
            domLayout: "autoHeight", // 2025-02-19 추가 옵션
            suppressColumnVirtualisation: true, // 2025-02-19 추가 옵션
            components: {
                bootstrapDatePickerEditor: function () {
                    return {
                        init: function (params) {
                            const input = document.createElement('input');
                            input.id = 'date';
                            input.type = 'text';
                            input.className = 'form-control datepicker';
                            input.value = params.value || '';
                            input.placeholder = "YYYY-MM-DD";

                            const label = document.createElement('label');
                            label.className = 'input-group-text';
                            label.htmlFor = 'date';
                            label.innerHTML = '<i class="icon calendar"></i>';

                            input.addEventListener('input', function () {
                                params.api.stopEditing();
                            });

                            this.eInput = input;
                            this.eLabel = label;

                            const wrapper = document.createElement('div');
                            wrapper.className = 'input-date-group';
                            wrapper.appendChild(input);
                            wrapper.appendChild(label);
                            this.eWrapper = wrapper;

                            $(input).datepicker({
                                format: 'yyyy-mm-dd',
                                autoclose: true
                            });
                            input.value = params.value;

                            input.addEventListener('change', function () {
                                params.api.stopEditing();
                            });
                        },
                        getValue: function () {
                            return this.eInput.value;
                        },
                        getGui: function () {
                            return this.eWrapper;
                        }
                    };
                },
                customInputSearchEditor: function () {
                    return {
                        init: function (params) {

                            const input = document.createElement('input');
                            input.id = 'searchId';
                            input.type = 'search';
                            input.className = 'form-control';
                            input.value = params.value || '';
                            input.placeholder = "입력";

                            const label = document.createElement('label');
                            label.htmlFor = 'searchId';
                            label.className = 'input-group-text';
                            label.innerHTML = '<i class="icon search"></i>';

                            // 클릭 이벤트 추가
                            label.addEventListener('click', function () {
                                alert('검색 버튼이 클릭되었습니다!');
                            });

                            input.addEventListener('input', function () {
                                params.api.stopEditing();
                            });

                            this.eInput = input;
                            this.eLabel = label;

                            const wrapper = document.createElement('div');
                            wrapper.className = 'input-search-group';
                            wrapper.appendChild(input);
                            wrapper.appendChild(label);
                            this.eWrapper = wrapper;
                        },
                        getValue: function () {
                            return this.eInput.value;
                        },
                        getGui: function () {
                            return this.eWrapper;
                        }
                    };
                },
            },
            // data empty style
            overlayNoRowsTemplate: '<div class="empty"><div class="empty-img"></div><div class="empty-txt">데이타가 없습니다.</div></div>',
        };
        
        const sampleGridDiv = document.querySelector("#sampleGrid");
        
        sampleGridApi = agGrid.createGrid(sampleGridDiv, sampleGridOptions);
       
    </script>
    <!--// script wrap -->
</body>
</html>
