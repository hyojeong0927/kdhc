<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <!-- css -->
    <link rel="stylesheet" href="../../../css/index.css">
    <!-- script -->
    <script src="../../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../../assets/js/common.js"></script>
</head>
<body>
    <div id="pop-wrap" class="kdhc-pop-wrap">
        <header class="kdhc-pop-header">
            <h1 class="pop-title">휴대용 저장매체 사용내역</h1>
            <button type="button" class="btn-close" aria-label="Close" onclick="window.close()"></button>

        <!-- 팝업 컨테이너 영역 -->

            <div class="inner">

                <div class="contents">
                    <!-- breadcrumbs start -->
                    <nav id="breadcrumb" class="breadcrumb-wrap" aria-label="breadcrumb"

                        { "name": "클린PC", "url": "#" },
                        { "name": "휴대용 저장매체 사용내역", "url": "#" },
                        { "name": "휴대용 저장매체 사용내역", "url": "", "active": true }
                        ]'
                        data-visible="true">
                    </nav>
                    <!--// breadcrumbs end -->

                    <!-- 휴대용 자산관리번호 조회 -->

                        <div class="title-wrap" data-title="휴대용 저장매체 조회" data-heading="h3"></div>
                        <!--// section tit end -->
                        <!-- input form -->
                        <div class="input-form-area">
                            <!-- form start -->
                             <form>
                                <fieldset>
                                    <!-- form-wrap start -->
                                    <div class="form-wrap type01 only-child">
                                        <!-- row -->
                                        <div class="form-row">
                                            <!-- col -->
                                            <div class="col">
                                                <div class="form-label">휴대용 자산관리번호</div>
                                                <div class="form-group">
                                                    <!-- input search group start : class="input-search-group is-error"-->
                                                    <div class="input-search-group">
                                                        <input type="search" class="form-control" id="search1" value="" placeholder="입력">
                                                        <label class="input-group-text" for="search1"><i class="icon search"></i></label>
                                                    </div>
                                                    <!--// input search group end -->
                                                    <!-- 에러 문구 : hidden 제거-->
                                                    <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                    <!--// 에러 문구 -->
                                                </div>
                                            </div>
                                            <!--// col -->
                                        </div>
                                        <!-- row -->
                                        <div class="form-row search-btn">
                                            <button type="button" class="btn btn-primary lg">조회</button>
                                        </div>
                                        <!--// row end -->
                                    </div>
                                    <!--// form-wrap end -->
                                </fieldset>
                             </form>
                            <!-- form end -->
                        </div>
                        <!--// input form -->
                        <!-- 조회 내역 -->
                        <div class="input-form-area">
                            <!-- form start -->
                            <form>
                                <fieldset>
                                    <table class="tbl-input-form">
                                        <caption>점검항목</caption>
                                        <colgroup>
                                            <col width="152px" />
                                            <col width="*" />
                                            <col width="147px" />
                                            <col width="140px" />
                                        </colgroup>
                                        <thead>
                                            <tr>
                                                <th scope="col">번호</th>
                                                <th scope="col">관리번호(S/N)</th>
                                                <th scope="col">등급</th>
                                                <th scope="col">매체 형태</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td class="center">1</td>
                                                <td class="center">화성-제어-HDD-001</td>
                                                <td class="center">일반</td>
                                                <td class="center">외장 HDD</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </fieldset>
                            </form>
                            <!--// form end -->
                        </div>
                        <!--// 조회 내역  -->
                    </article>
                    <!--// 휴대용 자산관리번호 조회 -->

                    <!-- 휴대용 저장매체 사용 내역 -->
                    <article class="section">

                        <article class="grid-top-area">
                            <!-- grid top left start -->
                            <div class="grid-top-left">
                                <!-- section tit start -->
                                <div class="title-wrap" data-title="휴대용 저장매체 사용 내역" data-heading="h3"></div>
                                <!--// section tit end -->
                            </div>
                            <!--// grid top left end -->
                            <!-- grid top button start -->
                            <div class="grid-top-btn" data-buttons='[{"text": "행추가"}, {"text": "결재"}]'>
                            </div>
                            <!--// grid top button end -->
                        </article>
                        <!--// grid top end -->

                        <!-- grid wrap start -->
                        <article class="grid-wrap">
                            <div id="sampleGrid" class="normal"></div>
                        </article>
                        <!--// grid wrap end -->

                    </article>
                    <!--// 휴대용 저장매체 사용 내역 -->
                  
                </div>
                <!--// 팝업 컨텐츠 영역 -->
            </div>
        </section>
        <!--// 팝업 컨테이너 영역 -->
    </div>
