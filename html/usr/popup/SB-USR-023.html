<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <!-- css -->
    <link rel="stylesheet" href="../../../css/index.css">
    <!-- script -->
    <script src="../../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../../assets/js/common.js"></script>
</head>

<body>
    <div id="pop-wrap" class="kdhc-pop-wrap">
        <header class="kdhc-pop-header">
            <h1 class="pop-title">봉인장치사용내역 등록 구분 추가</h1>
            <button type="button" class="btn-close" aria-label="Close" onclick="window.close()"></button>
        </header>
        <!-- 팝업 컨테이너 영역 -->
        <section class="kdhc-pop-container">
            <div class="inner">
                <!-- 팝업 컨텐츠 영역 -->
                <div class="contents">
                    <!-- breadcrumbs start -->
                    <nav id="breadcrumb" class="breadcrumb-wrap" aria-label="breadcrumb" data-breadcrumb='[
                        { "name": "물리보안", "url": "#" },
                        { "name": "영상정보장치 점검", "url": "#" },
                        { "name": "영상정보장치 점검 등록", "url": "" },
                        { "name": "구분 추가", "url": "", "active": true }
                        ]' data-visible="true">
                    </nav>
                    <!--// breadcrumbs end -->

                    <!-- 기본정보 -->
                    <article class="section">
                    
                        <!-- input form -->
                        <div class="input-form-area">
                            <!-- form start -->
                            <form>
                                <fieldset>
                                    <!-- form-wrap start -->
                                    <div class="form-wrap type02">
                                        <!-- row -->
                                        <div class="form-row">
                                            <!-- col -->
                                            <div class="col">
                                                <div class="form-label">자산관리번호</div>
                                                <div class="form-group">
                                                    <div class="input-txt">화성-노트북-0001</div>
                                                </div>
                                            </div>
                                            <!--// col -->
                                            <!-- col -->
                                            <div class="col">
                                                <div class="form-label">시스템명</div>
                                                <div class="form-group">
                                                    <div class="input-txt">네트워크설비 유지보수</div>
                                                </div>
                                            </div>
                                            <!--// col -->
                                        </div>
                                        <!--// row end -->
                                    </div>
                                    <!--// form-wrap end -->
                                </fieldset>
                            </form>
                            <!-- form end -->
                        </div>
                        <!--// input form -->
                    </article>
                    <!--// 기본정보 -->

                    <!-- 봉인장치사용내역 등록 : 구분 추가 -->
                    <!-- grid top start -->
                    <article class="grid-top-area">
                        <!-- grid top button start -->
                        <div class="grid-top-btn" data-buttons='[{"text": "행추가"}, {"text": "저장", "class": "btn btn-secondary btn-sm"}]'>
                        </div>
                        <!--// grid top button end -->
                    </article>
                    <!--// grid top end -->
                    
                    <!-- grid wrap start -->
                    <article class="grid-wrap">
                        <div id="sampleGrid" class="normal"></div>
                    </article>
                    <!--// grid wrap end -->

                    <!-- grid bottom start -->
                    <article class="grid-bottom-area">
                        <!-- 페이징 -->
                        <nav class="page-navigation" aria-label="page navigation">
                            <script type="module" src="../../../assets/js/components/pagination.js"></script>
                        </nav>
                        <!--// 페이징 -->
                    </article>
                    <!--// grid bottom end -->
                    <!--// 봉인장치사용내역 등록 : 구분 추가-->
                </div>
                <!--// 팝업 컨텐츠 영역 -->
            </div>
        </section>
        <!--// 팝업 컨테이너 영역 -->
    </div>
    <!-- script wrap -->
    <script type="module">
        const rowData = [
            {
                field01: "",
                field02: "용도",
                field03: "",
                field04: "봉인 관리번호",
                field05: "비고",
                field06: "",
            },
            {
                field01: "",
                field02: "용도",
                field03: "화성-001",
                field04: "봉인 관리번호",
                field05: "비고",
                field06: "",
            },
            {
                field01: "",
                field02: "용도",
                field03: "화성-001",
                field04: "봉인 관리번호",
                field05: "비고",
                field06: "",
            },
            {
                field01: "",
                field02: "용도",
                field03: "화성-001",
                field04: "봉인 관리번호",
                field05: "비고",
                field06: "",
            },
        ];
        const columnDefs = [ 
            {
                headerName: "구분",
                headerClass: "center",
                field: "field01",
                width: 160,
                cellClass: "cell-normal input",
                editable: true,
                cellRenderer: (params) => {
                    const value = params.value;

                    if (!value) {
                        return `
                            <!-- select-group -->
                            <div class="select-group">
                                <select class="form-select" aria-label="Default select" required>
                                    <option value="" selected>선택</option>
                                    <option value="1">One</option>
                                    <option value="2">Two</option>
                                    <option value="3">Three</option>
                                </select>
                            </div>
                            <!--// select-group -->
                        `;
                    } else {
                        return value;
                    }
                }
                
            },
            {
                headerName: "사용 중 포트 봉인",
                headerClass: "center",
                width: 238,
                cellClass: "cell-normal",
                children: [
                    {
                        headerName: "용도",
                        headerClass: "center",
                        field: "field02",
                        width: 160,
                        cellClass: "cell-normal",
                    },
                    {
                        headerName: "봉인 관리번호",
                        headerClass: "center",
                        field: "field03",
                        width: 160,
                        cellClass: "cell-normal",
                        editable: true,
                        cellEditor: 'customInputSearchEditor',
                        cellRenderer: (params) => {
                            const value = params.value;

                            if (!value) {
                                return `
                                    <!-- input search group start -->
                                    <div class="input-search-group">
                                        <input type="search" class="form-control" id="search1" placeholder="화성" value="">
                                        <label class="input-group-text" for="search1"><i class="icon search"></i></label>
                                    </div>
                                    <!--// input search group end -->
                                `;
                            } else {
                                return value;
                            }
                        }
                    },
                ]
            },
            {
                headerName: "미사용 포트 봉인",
                headerClass: "center",
                minWidth: 160,
                flex: 1,
                cellClass: "cell-normal",
                children: [
                    {
                        headerName: "봉인 관리번호",
                        headerClass: "center",
                        field: "field04",
                        width: 160,
                        cellClass: "cell-normal",
                    }
                ]
            },
            {
                headerName: "비고",
                headerClass: "center",
                field: "field05",
                minWidth: 120,
                flex: 1,
                cellClass: "cell-normal",
            },
             {
                headerName: "삭제",
                headerClass: "center",
                field: "field06",
                width: 160,
                cellClass: "cell-normal",
                cellRenderer: params => {
                    return '<button type="button" class="btn btn-icon"><i class="icon del-trash" /></button>';
                }
            },
        ];
        let sampleGridApi;
        
        const sampleGridOptions = {
            defaultColDef: {
                editable: false, // edit 사용 유무
                autoHeight: true,
                sortable: false, // sort 사용 유무
            },
            columnDefs,
            headerHeight: 41, // header height
            rowData: rowData,
            rowHeight: 63, // row height
            domLayout: "autoHeight", // 2025-02-19 추가 옵션
            suppressColumnVirtualisation: true, // 2025-02-19 추가 옵션
            components: {
                customInputSearchEditor: function () {
                    return {
                        init: function (params) {

                            const input = document.createElement('input');
                            input.id = 'searchId';
                            input.type = 'search';
                            input.className = 'form-control';
                            input.value = params.value || '';
                            input.placeholder = "입력";

                            const label = document.createElement('label');
                            label.htmlFor = 'searchId';
                            label.className = 'input-group-text';
                            label.innerHTML = '<i class="icon search"></i>';

                            // 클릭 이벤트 추가
                            label.addEventListener('click', function () {
                                alert('검색 버튼이 클릭되었습니다!');
                            });

                            input.addEventListener('input', function () {
                                params.api.stopEditing();
                            });

                            this.eInput = input;
                            this.eLabel = label;

                            const wrapper = document.createElement('div');
                            wrapper.className = 'input-search-group';
                            wrapper.appendChild(input);
                            wrapper.appendChild(label);
                            this.eWrapper = wrapper;
                        },
                        getValue: function () {
                            return this.eInput.value;
                        },
                        getGui: function () {
                            return this.eWrapper;
                        }
                    };
                },
            },
            // data empty style
            overlayNoRowsTemplate: '<div class="empty"><div class="empty-img"></div><div class="empty-txt">데이타가 없습니다.</div></div>',
        };
        const sampleGridDiv = document.querySelector("#sampleGrid");
        sampleGridApi = agGrid.createGrid(sampleGridDiv, sampleGridOptions);
    </script>
    <!--// script wrap -->
</body>
</html>
