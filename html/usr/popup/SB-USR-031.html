<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <!-- css -->
    <link rel="stylesheet" href="../../../css/index.css">
    <!-- script -->
    <script src="../../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../../assets/js/common.js"></script>
</head>
<body>
    <div id="pop-wrap" class="kdhc-pop-wrap">
        <header class="kdhc-pop-header">
            <h1 class="pop-title">공개취약점내역 등록</h1>
            <button type="button" class="btn-close" aria-label="Close" onclick="window.close()"></button>
        </header>
        <!-- 팝업 컨테이너 영역 -->
        <section class="kdhc-pop-container">
            <div class="inner">
                <!-- 팝업 컨텐츠 영역 -->
                <div class="contents">
                    <!-- breadcrumbs start -->
                    <nav id="breadcrumb" class="breadcrumb-wrap" aria-label="breadcrumb" 
                        data-breadcrumb='[
                            { "name": "기술보안", "url": "#" },
                            { "name": "공개취약점내역", "url": "#" },
                            { "name": "공개취약점내역 등록 ", "url": "", "active": true }
                        ]'
                        data-visible="true">
                    </nav>
                    <!--// breadcrumbs end -->

                    <!--  -->
                    <article class="section">
                        <!-- grid top start -->
                        <article class="grid-top-area">
                            <!-- grid top button start -->
                            <div class="grid-top-btn" data-buttons='[{"text": "행추가"}, {"text": "행삭제"}, {"text": "임시저장"}]'>
                            </div>
                            <!--// grid top button end -->
                        </article>
                        <!--// grid top end -->

                        <!-- grid wrap start -->
                        <article class="grid-wrap">
                            <div id="sampleGrid" class="normal"></div>
                        </article>
                        <!--// grid wrap end -->
                    </article>
                    <!--//  -->
                    <!-- 결재정보 -->
                    <article class="section">

                        <!-- section tit start -->
                        <div class="title-wrap" data-title="결재정보" data-heading="h3"></div>
                        <!--// section tit end -->

                        <div class="section-sub">
                            <!-- 결재 컴퍼넌트 영역 -->
                            <div class="approve">

                                <div class="approve-sec">
                                    <div class="title-wrap" data-title="결재정보" data-heading="h6"></div>
                                    <!-- input form -->
                                    <div class="input-form-area">
                                        <!-- form start -->
                                        <form>
                                            <fieldset>
                                                <!-- form-wrap start -->
                                                <div class="form-wrap type02">
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">기안일</div>
                                                            <div class="form-group">
                                                                <div class="input-txt"><!-- 텍스트 영역 --></div>
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">결재 명</div>
                                                            <div class="form-group">
                                                                <div class="input-txt"><!-- 텍스트 영역 --></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!--// row end-->
                                                </div>
                                                <!--// form-wrap end -->
                                            </fieldset>
                                        </form>
                                        <!-- form end -->
                                    </div>
                                    <!--// input form -->
                                </div>

                                <div class="approve-sec">
                                    <div class="title-wrap" data-title="결재상태" data-heading="h6"></div>
                                    <!-- 결재상태 -->
                                    <div class="process-status">
                                        <!-- step start -->
                                        <div id="step-container" class="step step-lg" data-step='[
                                            { "status": "step-current", "title": "기안자", "name": "계전보안부 이현경" },
                                            { "status": "step-default", "title": "제어보호담당자", "name": "계전보안부 오승환" },
                                            { "status": "step-default", "title": "제어보호담당관", "name": "계전보안부 김현수" }]'></div>
                                        <script type="module" src="../../../assets/js/components/step.js"></script>
                                        <!-- step end -->
                                    </div>
                                    <!--// 결재상태 -->
                                </div>

                                <div class="approve-sec type01">
                                    <div class="title-wrap" data-title="결재진행" data-heading="h6"></div>
                                    <!-- input form -->
                                    <div class="input-form-area">
                                        <!-- form start -->
                                        <form>
                                            <fieldset>
                                                <!-- form-wrap start -->
                                                <div class="form-wrap type02">
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">제어보호담당관</div>
                                                            <div class="form-group">
                                                                <div class="input-txt">김현수</div>
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">결재일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center"></div>
                                                            </div>
                                                            <div class="form-group">
                                                                <!-- badge 영역 -->
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">제어보호담당자</div>
                                                            <div class="form-group">
                                                                <!-- input search group start -->
                                                                <div class="input-search-group">
                                                                    <input type="search" class="form-control" id="search1" value="오승환" placeholder="제어보호담당자 입력">
                                                                    <label class="input-group-text" for="search1"><i class="icon search"></i></label>
                                                                </div>
                                                                <!--// input search group end -->
                                                                <!-- 에러 문구 -->
                                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                                <!--// 에러 문구 -->
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">결재일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center"><!--  --></div>
                                                            </div>
                                                            <div class="form-group">
                                                                <!-- badge 영역 -->
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!-- row -->
                                                    <div class="form-row">
                                                        <div class="col">
                                                            <div class="form-label">기안자</div>
                                                            <div class="form-group">
                                                                <!-- input search group start -->
                                                                <div class="input-search-group">
                                                                    <input type="search" class="form-control" id="search1" value="이현경" placeholder="관리부서 차(팀)장 입력">
                                                                    <label class="input-group-text" for="search1"><i class="icon search"></i></label>
                                                                </div>
                                                                <!--// input search group end -->
                                                                <!-- 에러 문구 -->
                                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                                <!--// 에러 문구 -->
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-label">기안일자</div>
                                                            <div class="form-group">
                                                                <div class="input-txt center"><!--  -->2024.12.12 11:30</div>
                                                            </div>
                                                            <div class="form-group">
                                                                <!-- badge 영역 -->
                                                                <div class="input-badge-group center">
                                                                    <span class="badge badge-type01">기완완료</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!--// row end-->
                                                </div>
                                                <!--// form-wrap end -->
                                            </fieldset>
                                        </form>
                                        <!-- form end -->
                                    </div>
                                    <!--// input form -->
                                </div>

                            </div>
                            <!--// 결재 컴퍼넌트 영역 -->
                            <!-- bottom button area start -->
                            <div class="bottom-btn-area" 
                                data-buttons='[{"text": "회수"}, {"text": "결재"}]'>
                            </div>
                            <!--// bottom button area end -->
                        </div>
                    </article>
                    <!--// 결재정보 -->
                </div>
                <!--// 팝업 컨텐츠 영역 -->
            </div>
        </section>
        <!--// 팝업 컨테이너 영역 -->
    </div>
    <!-- script wrap -->
    <script type="module">
        const rowData = [
            {
                field01: "",
                field02: "",
                field03: "시스템 1",
                field04: "",
                field05: "",
                field06: "Emerson",
                field07: "Ovation",
                field08: "3.8.12",
                field09: "",
                field10: "",
                field11: "",
            },
        ];
        const columnDefs = [
            {
                headerName: "순번",
                headerClass: "center",
                field: "field01",
                width: 72,
                cellClass: "cell-normal",
                valueGetter: "node.rowIndex + 1"
            },
            {
                headerName: "자산관리번호",
                headerClass: "center",
                field: "field02",
                minWidth: 250,
                flex: 1,
                editable: true,
                cellClass: "cell-normal",
                cellEditor: 'customInputSearchEditor',
                cellRenderer: (params) => {
                    const value = params.value;

                    if (!value) {
                        return `
                            <!-- input search group start -->
                            <div class="input-search-group">
                                <input type="search" class="form-control" id="search1" placeholder="자산관리번호" value="">
                                <label class="input-group-text" for="search1"><i class="icon search"></i></label>
                            </div>
                            <!--// input search group end -->
                        `;
                    } else {
                        return value;
                    }
                }
            },
            {
                headerName: "시스템 명",
                headerClass: "center",
                field: "field03",
                width: 180,
                cellClass: "cell-normal",
            },
            {
                headerName: "취약점 번호",
                headerClass: "center",
                field: "field04",
                width: 180,
                editable: true,
                cellClass: "cell-normal",
                cellRenderer: (params) => {
                    const value = params.value;

                    if (!value) {
                        return `
                            <!-- input group -->
                            <div class="input-group">
                                <input type="text" id="input-text" class="form-control" placeholder="입력" value="">
                                <label for="input-text" class="hidden">입력</label>
                            </div>
                            <!--// input group -->
                        `;
                    } else {
                        return value;
                    }
                }
            },
            {
                headerName: "시스템 용도",
                headerClass: "center",
                field: "field05",
                width: 180,
                editable: true,
                cellClass: "cell-normal",
                cellRenderer: (params) => {
                    const value = params.value;

                    if (!value) {
                        return `
                            <!-- input group -->
                            <div class="input-group">
                                <input type="text" id="input-text" class="form-control" placeholder="입력" value="">
                                <label for="input-text" class="hidden">입력</label>
                            </div>
                            <!--// input group -->
                        `;
                    } else {
                        return value;
                    }
                }
            },
            {
                headerName: "제조사",
                headerClass: "center",
                field: "field06",
                width: 180,
                cellClass: "cell-normal",
            },
            {
                headerName: "프로그램 (모델명)",
                headerClass: "center",
                field: "field07",
                width: 180,
                cellClass: "cell-normal",
                cellEditor: 'agTextCellEditor',
                cellEditorParams: {
                    maxLength: 20
                },
            },
            {
                headerName: "펌웨어 버전",
                headerClass: "center",
                field: "field08",
                width: 180,
                cellClass: "cell-normal",
            },
            {
                headerName: "조치현황",
                headerClass: "center",
                field: "field09",
                width: 180,
                editable: true,
                cellClass: "cell-normal",
                cellRenderer: (params) => {
                    const value = params.value;

                    if (!value) {
                        return `
                            <!-- input group -->
                            <div class="input-group">
                                <input type="text" id="input-text" class="form-control" placeholder="입력" value="">
                                <label for="input-text" class="hidden">입력</label>
                            </div>
                            <!--// input group -->
                        `;
                    } else {
                        return value;
                    }
                }
            },
            {
                headerName: "기반시설 여부",
                headerClass: "center",
                field: "field10",
                width: 180,
                editable: true,
                cellClass: "cell-normal input",
                cellEditor: 'agSelectCellEditor',
                cellEditorParams: {
                    values: ['Y', 'N'],
                },
                cellRenderer: (params) => {
                    const value = params.value;

                    if (!value) {
                        return `
                           <!-- select-group -->
                            <div class="select-group">
                                <select class="form-select" aria-label="Default select" required>
                                    <option value="" selected>선택</option>
                                    <option value="Y">Y</option>
                                    <option value="N">N</option>
                                </select>
                            </div>
                            <!--// select-group -->
                        `;
                    } else {
                        return value;
                    }
                }
            },
            {
                headerName: "조치유예 여부",
                headerClass: "center",
                field: "field11",
                width: 180,
                editable: true,
                cellClass: "cell-normal input",
                cellEditor: 'agSelectCellEditor',
                cellEditorParams: {
                    values: ['Y', 'N'],
                },
                cellRenderer: (params) => {
                    const value = params.value;

                    if (!value) {
                        return `
                           <!-- select-group -->
                            <div class="select-group">
                                <select class="form-select" aria-label="Default select" required>
                                    <option value="">선택</option>
                                    <option value="Y" selected>Y</option>
                                    <option value="N">N</option>
                                </select>
                            </div>
                            <!--// select-group -->
                        `;
                    } else {
                        return value;
                    }
                }
            },
        ];
        let sampleGridApi;

        const sampleGridOptions = {
            defaultColDef: {
                editable: false, // edit 사용 유무
                autoHeight: true,
                sortable: false, // sort 사용 유무
            },
            columnDefs,
            headerHeight: 41, // header height
            rowData: rowData,
            rowHeight: 56, // row height
            rowSelection: { // row checkbox
                mode: "multiRow",
                groupSelects: "descendants",
                selectAll: 'filtered',
                width: 52,
            },
            domLayout: "autoHeight",
            suppressColumnVirtualisation: true,
            components: {
                customInputSearchEditor: function() {
                    return {
                        init: function(params) {
                            
                            const input = document.createElement('input');
                            input.id = 'searchId';
                            input.type = 'search';
                            input.className = 'form-control';
                            input.value = params.value || '';
                            input.placeholder = "입력";

                            const label = document.createElement('label');
                            label.htmlFor = 'searchId';
                            label.className = 'input-group-text';
                            label.innerHTML = '<i class="icon search"></i>';

                            // 클릭 이벤트 추가
                            label.addEventListener('click', function() {
                                alert('검색 버튼이 클릭되었습니다!');
                            });
                           
                            input.addEventListener('input', function() {
                                params.api.stopEditing();
                            });

                            this.eInput = input;
                            this.eLabel = label;

                            const wrapper = document.createElement('div');
                            wrapper.className = 'input-search-group';
                            wrapper.appendChild(input);
                            wrapper.appendChild(label);
                            this.eWrapper = wrapper;
                        },
                        getValue: function() {
                            return this.eInput.value;
                        },
                        getGui: function() {
                            return this.eWrapper;
                        }
                    };
                },
            },

            // data empty style
            overlayNoRowsTemplate: '<div class="empty"><div class="empty-img"></div><div class="empty-txt">데이타가 없습니다.</div></div>',
        };
        const sampleGridDiv = document.querySelector("#sampleGrid");
        sampleGridApi = agGrid.createGrid(sampleGridDiv, sampleGridOptions);
    </script>
    <!--// script wrap -->
</body>
</html>
