<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <!-- css -->
    <link rel="stylesheet" href="../../css/index.css">
    <!-- script -->
    <script src="../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../assets/js/common.js"></script>
</head>

<body>
    <div id="wrap" class="kdhc-wrap">

        <!-- 본문 바로가기 영역 -->
        <div id="kdhc-skip-link">
            <a href="#contents">본문 바로가기</a>
        </div>
        <!--// 본문 바로가기 영역  -->

        <!-- 상단 배너영역 -->
        <div id="kdhc-masthead">
            <script type="module" src="../../assets/js/layouts/top-banner.js"></script>
        </div>
        <!-- // 상단 배너영역 -->

        <!-- 헤더 영역 -->
        <header id="kdhc-header" data-menu='[
            { "title": "관리보안", "url": "#" },
            { "title": "물리보안", "url": "#" },
            { "title": "기술보안", "url": "#" },
            { "title": "보안정책", "url": "#" },
            { "title": "클린PC", "url": "#" },
            { "title": "정보자산", "url": "#" }]'>
            <script type="module" src="../../assets/js/layouts/header.js"></script>
        </header>
        <!--// 헤더 영역 -->

        <!-- 컨테이너 영역 -->
        <section id="kdhc-container">
            <div class="inner">
                <!-- 사이드 영역 -->
                <script type="module" src="../../assets/js/layouts/sidebar.js"></script>
                <aside id="sidebar" class="sidebar" data-menu='[
                        { "name": "popup", "url": "#" },
                        { "name": "alert", "url": "#" }]'></aside>
                <!--// 사이드 영역 -->

                <main class="main-contents">
                    <!-- breadcrumbs start : 현재 히든 처리 추후 변경 가능 -->
                    <nav id="breadcrumb" class="breadcrumb-wrap" aria-label="breadcrumb" data-breadcrumb='[
                            { "name": "물리보안", "url": "#" },
                            { "name": "영상정보장치 점검", "url": "", "active": true }
                        ]' data-visible="false">
                    </nav>
                    <!--// breadcrumbs end -->

                    <!-- 컨텐츠 영역 -->
                    <div id="contents" class="contents">

                        <!-- page title start -->
                        <div class="page-title-wrap" data-title="Alert" data-badge="" data-badge-visible="false">
                        </div>
                        <!--// page title end -->

                        <!-- Alert 호출 버튼 -->
                        <button type="button" class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
                            Alert - 004
                        </button>
                        <button type="button" class="btn btn-primary btn-lg" data-bs-toggle="modal-012" data-bs-target="#staticBackdrop">
                            Alert - 012
                        </button>
                        <button type="button" class="btn btn-primary btn-lg" data-bs-toggle="modal-014" data-bs-target="#staticBackdrop">
                            Alert - 014
                        </button>
                        <button type="button" class="btn btn-primary btn-lg" data-bs-toggle="modal-024" data-bs-target="#staticBackdrop">
                            Alert - 024
                        </button>
                        <!--// Alert 호출 버튼 -->

                    </div>
                    <!--// 컨텐츠 영역 -->

                </main>

            </div>
        </section>
        <!--// 컨테이너 영역 -->

        <!-- 푸터 영역 -->
        <footer id="kdhc-footer">
            <script type="module" src="../../assets/js/layouts/footer.js"></script>
        </footer>
        <!--// 푸터 영역 -->

    </div>
    <!-- script wrap -->
    <!--// script wrap -->

    <!-- Modal start -->
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog alert">
            <div class="modal-content">
                <div class="modal-body">
                    <div class="inner">
                        <div class="text-box">
                            <p class="is-error">로그인을 5회 시도하였습니다.</p>
                            <p>비밀번호가 기억나지 않는경우 관리자에게 연락 부탁드립니다.</p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline btn-md" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-secondary btn-md" data-bs-dismiss="modal">확인</button>
                </div>
            </div>
        </div>
    </div>
    <!--// Modal end -->
</body>

</html>
