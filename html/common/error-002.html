<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>error</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/x-icon">
    <!-- css -->
    <link rel="stylesheet" href="../../css/agGrid.css">
    <link rel="stylesheet" href="../../css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="../../css/bootstrap-treeview.min.css">
    <link rel="stylesheet" href="../../css/style.css?v=20250613"><!-- 버전 관리 적용 -->
</head>

<body>
    <div class="kdhc-blank-wrap">
        <section class="kdhc-error-container">
            <div class="inner">
                <!-- error box -->
                <div class="error-box">
                    <div class="error-head">
                        <strong class="error-type error-400">400</strong>
                        <div class="error-message">
                            죄송합니다.<br />
                            요청하신 페이지를 찾을 수 없습니다.
                        </div>
                    </div>
                    <div class="error-content">
                        <p class="txt">
                            페이지가 존재하지 않거나 사용할 수 없는 페이지입니다.
                        </p>
                        <p class="txt">
                            입력하신 주소가 정확한지 다시 한 번 확인해 주시기 바랍니다.
                        </p>
                    </div>
                    <!-- bottom button area -->
                    <div class="bottom-btn-area">
                        <button type="button" class="btn btn-secondary btn-md">이전 페이지</button>
                    </div>
                    <!--// bottom button area -->
                </div>
                <!--// error box -->
            </div>
        </section>
    </div>
</body>

</html>
