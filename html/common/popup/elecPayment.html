<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <link rel="icon" href="../../../assets/favicon.svg" type="image/x-icon">
    <!-- css -->
    <link rel="stylesheet" href="../../../css/agGrid.css">
    <link rel="stylesheet" href="../../../css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="../../../css/bootstrap-treeview.min.css">
    <link rel="stylesheet" href="../../../css/style.css?v=20250613"><!-- 버전 관리 적용 -->
    <!-- script -->
    <script src="../../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../../assets/js/common.js"></script>
</head>

<body>
    <div id="pop-wrap" class="kdhc-pop-wrap approval">
        <header class="kdhc-pop-header">
            <h1 class="pop-title" id="staticBackdropLabel">전자결재</h1>
            <button type="button" class="btn-close" aria-label="Close" onclick="window.close()"></button>
        </header>
        <!-- 팝업 컨테이너 영역 -->
        <section class="kdhc-pop-container">
            <div class="inner">
                <!-- 팝업 컨텐츠 영역 -->
                <div class="contents">
                    <!-- input-form -->
                    <div class="input-form-area">
                        <form>
                            <fieldset>
                                <!-- form-wrap start -->
                                <div class="form-wrap type04">
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col -->
                                        <div class="col">
                                            <div class="form-group">
                                                <!-- select-group is-error -->
                                                <div class="select-group">
                                                    <select class="form-select" aria-label="Default select" required>
                                                        <option value="">선택</option>
                                                        <option value="1" selected>반려</option>
                                                        <option value="2">Two</option>
                                                        <option value="3">Three</option>
                                                    </select>
                                                </div>
                                                <!--// select-group -->
                                                <!-- 에러 문구 : hidden -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    <div class="form-row">
                                        <!-- col -->
                                        <div class="col">
                                            <div class="form-label" aria-required="true">사번</div>
                                            <div class="form-group">
                                                <!-- input group : class="input-groupis-error" -->
                                                <div class="input-group">
                                                    <input type="text" id="input-text" class="form-control" placeholder="사번 입력" value="">
                                                    <label for="input-text" class="hidden">사번</label>
                                                </div>
                                                <!--// input group -->
                                                <!-- 에러 문구 : hidden -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    <!--// row -->
                                    <div class="form-row">
                                        <!-- col -->
                                        <div class="col">
                                            <div class="form-label" aria-required="true">비밀번호</div>
                                            <div class="form-group">
                                                <!-- input group : class="input-groupis-error" -->
                                                <div class="input-group">
                                                    <input type="password" id="input-text" class="form-control" placeholder="비밀번호 입력" value="">
                                                    <label for="input-text" class="hidden">비밀번호</label>
                                                </div>
                                                <!--// input group -->
                                                <!-- 에러 문구 : hidden -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    <!--// row -->
                                </div>
                                <!-- form-wrap end -->
                            </fieldset>
                        </form>
                    </div>
                    <!--// input-form -->
                </div>
                <!--// 팝업 컨텐츠 영역 -->
            </div>
        </section>
        <!--// 팝업 컨테이너 영역 -->
        <footer class="kdhc-pop-footer">
            <div class="inner">
                <button type="button" class="btn btn-secondary btn-md">결재</button>
            </div>
        </footer>
    </div>
    <!-- script wrap -->
    <!--// script wrap -->
</body>

</html>
