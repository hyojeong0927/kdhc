<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/x-icon">
    <!-- css -->
    <link rel="stylesheet" href="../../../css/index.css">
    <!-- script -->
    <script src="../../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../../assets/js/common.js"></script>
</head>

<body>
    <div id="pop-wrap" class="kdhc-pop-wrap small">
        <header class="kdhc-pop-header">
            <h1 class="pop-title" id="staticBackdropLabel">스티커번호관리</h1>
            <button type="button" class="btn-close" aria-label="Close" onclick="window.close()"></button>
        </header>
        <!-- 팝업 컨테이너 영역 -->
        <section class="kdhc-pop-container">
            <div class="inner">
                <!-- 팝업 컨텐츠 영역 -->
                <div class="contents">
                    <!-- grid top start -->
                    <article class="grid-top-area">
                        <!-- grid top left start -->
                        <div class="grid-top-left">
                            <select class="form-select sm" aria-label="Default select" required>
                                <option value="">선택</option>
                                <option value="10" selected>10개씩 보기</option>
                                <option value="20">20개씩 보기</option>
                                <option value="30">30개씩 보기</option>
                                <option value="50">50개씩 보기</option>
                            </select>
                        </div>
                        <!--// grid top left end -->
                    
                        <!-- grid top button start -->
                        <div class="grid-top-btn"
                            data-buttons='[{"text": "조회", "class": "btn btn-secondary btn-sm"}]'>
                        </div>
                        <!--// grid top button end -->
                    </article>
                    <!--// grid top end -->
                    <!-- grid wrap start -->
                    <article class="grid-wrap">
                        <div id="sampleGrid" class="normal"></div>
                    </article>
                    <!--// grid wrap end -->
                </div>
                <!--// 팝업 컨텐츠 영역 -->
            </div>
        </section>
        <!--// 팝업 컨테이너 영역 -->
        <footer class="kdhc-pop-footer">
            <div class="inner">
                <button type="button" class="btn btn-outline btn-md">저장</button>
            </div>
        </footer>
    </div>
    <!-- script wrap -->
    <script type="module">
        const rowData = [
            { field01: "001", field02: "Y", field03: "분실" },
            { field01: "002", field02: "Y", field03: "정상" },
            { field01: "003", field02: "N", field03: "정상" },
            { field01: "004", field02: "N", field03: "정상" },
            { field01: "005", field02: "N", field03: "정상" },
            { field01: "006", field02: "N", field03: "정상" },
            { field01: "007", field02: "N", field03: "정상" },
        ];
        const columnDefs = [
            {
                headerName: "스티커번호",
                headerClass: "center",
                field: "field01",
                minWidth: 120,
                flex: 1,
                cellClass: "cell-normal",
            },
            {
                headerName: "사용여부",
                headerClass: "center",
                field: "field02",
                width: 120,
                cellClass: "cell-normal input",
                cellRenderer: (params) => {
                    const value = params.value;
                    if (value === "Y") {
                        return `
                            <!-- select-group is-error -->
                            <div class="select-group">
                                <select class="form-select" aria-label="Default select" required>
                                    <option value="">선택</option>
                                    <option value="Y" selected>Y</option>
                                    <option value="N">N</option>
                                </select>
                            </div>
                            <!--// select-group -->
                        `;
                    } else if (value === "N") {
                        return `
                            <!-- select-group is-error -->
                            <div class="select-group">
                                <select class="form-select" aria-label="Default select" required>
                                    <option value="">선택</option>
                                    <option value="Y">Y</option>
                                    <option value="N" selected>N</option>
                                </select>
                            </div>
                            <!--// select-group -->
                        `;
                    }
                }
            },
            {
                headerName: "사유",
                headerClass: "center",
                field: "field03",
                width: 150,
                cellClass: "cell-normal input",
                cellRenderer: (params) => {
                    const value = params.value;
                    if (value === "분실") {
                        return `
                            <!-- select-group is-error -->
                            <div class="select-group">
                                <select class="form-select" aria-label="Default select" required>
                                    <option value="">선택</option>
                                    <option value="분실" selected>분실</option>
                                    <option value="정상">정상</option>
                                </select>
                            </div>
                            <!--// select-group -->
                        `;
                    } else if (value === "정상") {
                        return `
                            <!-- select-group is-error -->
                            <div class="select-group">
                                <select class="form-select" aria-label="Default select" required>
                                    <option value="">선택</option>
                                    <option value="분실">분실</option>
                                    <option value="정상" selected>정상</option>
                                </select>
                            </div>
                            <!--// select-group -->
                        `;
                    } else {
                        return value;
                    }
                    
                }
            },
        ];
        let sampleGridApi;

        const sampleGridOptions = {
            defaultColDef: {
                editable: true, // edit 사용 유무
                autoHeight: true,
                sortable: true, // sort 사용 유무
            },
            columnDefs,
            headerHeight: 41, // header height
            rowData: rowData,
            rowHeight: 47, // row height // 2025-02-19 수정
            rowSelection: { // row checkbox
                mode: "multiRow",
                groupSelects: "descendants",
                selectAll: 'filtered',
                width: 52,
            },
            domLayout: "autoHeight", // 2025-02-19 추가 옵션
            suppressColumnVirtualisation: true, // 2025-02-19 추가 옵션

            // data empty style
            overlayNoRowsTemplate: '<div class="empty"><div class="empty-img"></div><div class="empty-txt">데이타가 없습니다.</div></div>',
        };
        const sampleGridDiv = document.querySelector("#sampleGrid");
        sampleGridApi = agGrid.createGrid(sampleGridDiv, sampleGridOptions);
    </script>
    <!--// script wrap -->
</body>

</html>
