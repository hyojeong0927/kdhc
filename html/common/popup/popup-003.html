<!DOCTYPE html>
<html lang="ko" data-kdhc-mode="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDHC</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/x-icon">
    <!-- css -->
    <link rel="stylesheet" href="../../../css/index.css">
    <!-- script -->
    <script src="../../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../../assets/js/common.js"></script>
</head>

<body>
    <div id="pop-wrap" class="kdhc-pop-wrap medium">
        <header class="kdhc-pop-header">
            <h1 class="pop-title" id="staticBackdropLabel">봉인관리번호</h1>
            <button type="button" class="btn-close" aria-label="Close" onclick="window.close()"></button>
        </header>
        <!-- 팝업 컨테이너 영역 -->
        <section class="kdhc-pop-container not-footer">
            <div class="inner">
                <!-- 팝업 컨텐츠 영역 -->
                <div class="contents">

                    <!-- search start-->
                    <article class="search-form-area">
                        <!-- form start -->
                        <form>
                            <fieldset>

                                <!-- form-wrap start -->
                                <div class="form-wrap type06">
                                    <!-- row -->
                                    <div class="form-row">
                                        <!-- col  -->
                                        <div class="col w-170">
                                            <div class="form-group">
                                                <!-- select-group is-error -->
                                                <div class="select-group">
                                                    <select class="form-select" aria-label="Default select" required>
                                                        <option value="" selected>선택</option>
                                                        <option value="1">One</option>
                                                        <option value="2">Two</option>
                                                        <option value="3">Three</option>
                                                    </select>
                                                </div>
                                                <!--// select group -->
                                                <!-- 에러 문구 : hidden -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                        <!-- col  -->
                                        <div class="col w-170">
                                            <div class="form-group">
                                                <!-- select-group is-error -->
                                                <div class="select-group">
                                                    <select class="form-select" aria-label="Default select" required>
                                                        <option value="" selected>선택</option>
                                                        <option value="1">One</option>
                                                        <option value="2">Two</option>
                                                        <option value="3">Three</option>
                                                    </select>
                                                </div>
                                                <!--// select group -->
                                                <!-- 에러 문구 : hidden -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                        <!-- col  -->
                                        <div class="col col-6">
                                            <div class="form-group">

                                                <!-- input-group is-error  -->
                                                <div class="input-group">
                                                    <input type="text" id="input-text" class="form-control" placeholder="입력" value="">
                                                    <label for="input-text" class="hidden">입력</label>
                                                </div>
                                                <!--// input group -->

                                                <!-- 에러 문구 : hidden 제거 -->
                                                <p class="form-hint-invalid hidden">잘못 입력하였습니다.</p>
                                                <!--// 에러 문구 -->
                                            </div>
                                        </div>
                                        <!--// col  -->
                                    </div>
                                    
                                    <!-- row -->
                                    <div class="form-row search-btn">
                                        <button type="button" class="btn btn-primary lg">조회</button>
                                    </div>
                                    <!--// row end -->
                                </div>
                                <!--// form-wrap end -->

                            </fieldset>
                        </form>
                        <!--// form end -->
                    </div>
                    <!--// search end -->

                    <!-- grid wrap start -->
                    <article class="grid-wrap">
                        <div id="sampleGrid" class="normal"></div>
                    </article>
                    <!--// grid wrap end -->
                    <!-- grid bottom start -->
                    <article class="grid-bottom-area">
                        <!-- 페이징 -->
                        <nav class="page-navigation" aria-label="page navigation">
                            <script type="module" src="../../../assets/js/components/pagination.js"></script>
                        </nav>
                        <!--// 페이징 -->
                    </article>
                    <!--// grid bottom end -->
                </div>
                <!--// 팝업 컨텐츠 영역 -->
            </div>
        </section>
        <!--// 팝업 컨테이너 영역 -->
        <!-- <footer class="kdhc-pop-footer">
            <div class="inner">
                <button type="button" class="btn btn-secondary btn-md">저장</button>
            </div>
        </footer> -->
    </div>
    <!-- script wrap -->
    <script type="module">
        const rowData = [
            {
                field01: "화성-000",
                field02: "Y",
            },
            {
                field01: "화성-000",
                field02: "Y",
            },
            {
                field01: "화성-000",
                field02: "N",
            },
            {
                field01: "화성-000",
                field02: "Y",
            },
        ];
        const columnDefs = [
            {
                headerName: "봉인관리번호",
                headerClass: "center",
                field: "field01",
                width: 360,
                cellClass: "cell-normal",
            },     
            {
                headerName: "사용여부",
                headerClass: "center",
                field: "field02",
                minWidth: 360,
                flex: 1,
                cellClass: "cell-normal",
            },
        ];
        let sampleGridApi;

        const sampleGridOptions = {
            defaultColDef: {
                editable: true, // edit 사용 유무
                autoHeight: true,
                sortable: true, // sort 사용 유무
            },
            columnDefs,
            headerHeight: 41, // header height
            rowData: rowData,
            rowHeight: 47, // row height // 2025-02-19 수정
            domLayout: "autoHeight", // 2025-02-19 추가 옵션
            suppressColumnVirtualisation: true, // 2025-02-19 추가 옵션

            // data empty style
            overlayNoRowsTemplate: '<div class="empty"><div class="empty-img"></div><div class="empty-txt">데이타가 없습니다.</div></div>',
        };
        const sampleGridDiv = document.querySelector("#sampleGrid");
        sampleGridApi = agGrid.createGrid(sampleGridDiv, sampleGridOptions);
    </script>
    <!--// script wrap -->
</body>

</html>
