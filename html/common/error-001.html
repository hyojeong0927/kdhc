<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>error</title>
    <!-- css -->
    <link rel="stylesheet" href="../../css/index.css">
</head>
<body>
    <div class="kdhc-blank-wrap">
        <section class="kdhc-error-container">
            <div class="inner">
                <!-- error box -->
                <div class="error-box">
                    <div class="error-head">
                        <strong class="error-type error-500">500</strong>
                        <div class="error-message">
                            죄송합니다.<br />
                            요청하신 페이지에 오류가 발생하였습니다.
                        </div>
                    </div>
                    <div class="error-content">
                        <p class="txt">
                            방문하시려는 페이지의 주소가 잘못 입력되었거나<br />
                            페이지의 주소가 변경 혹은 삭제되어 요청하신 페이지를 찾을 수 없습니다.
                        </p>
                        <p class="txt">
                            입력하신 주소가 정확한지 다시 한 번 확인해 주시기 바랍니다.<br />
                            오류가 계속 발생하는 경우 관리자에게 문의하시기 바랍니다.
                        </p>
                    </div>
                    <!-- bottom button area -->
                    <div class="bottom-btn-area">
                        <button type="button" class="btn btn-secondary btn-md">이전 페이지</button>
                    </div>
                    <!--// bottom button area -->
                </div>
                <!--// error box -->
            </div>
        </section>
    </div>
</body>
</html>
