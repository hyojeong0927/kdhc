<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout</title>
    <!-- css -->
    <link rel="stylesheet" href="../../css/index.css">
</head>
<body>
    <article class="guide-contents">
		<div class="title">
			<h3>Layout</h3>
		</div>
		<div class="text-box">
			<ol>
				<li>그리드 시스템 : 12컬럼 그리드 기반 (최소 1920px 너비, 1080 높이)</li>
				<li>여백 규칙
					<ul>
						<li>내부 패딩 : 최소 10px</li>
						<li>외부 마진 : 최소 40px</li>
					</ul>
				</li>
				<li>섹션 구분 : 시각적 명확성을 위해 섹션 간 최소 24px 간격 유지</li>
			</ol>
		</div> 
		<h4>LNB - open</h4>
		<div class="layout-box">
			<article class="layout-container">
				<div class="layout-header">GNB<br />높이 103px</div>
				<div class="layout-aside">LNB<br />가로 280px</div>
				<div class="layout-main">Content<br />가로 1560px</div>
			</article>
		</div>
		<br /><br />
		<h4>LNB - closed</h4>
		<div class="layout-box">
			<article class="layout-container close">
				<div class="layout-header">GNB<br />높이 103px</div>
				<div class="layout-aside">LNB<br />가로 60px</div>
				<div class="layout-main">Content<br />가로 1780px</div>
			</article>
		</div>
    </article>
    
</body>
</html>
