<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>button</title>
    <!-- css -->
    <link rel="stylesheet" href="../../../css/index.css">
    <!-- script -->
    <script type="module" src="../../../assets/js/common.js"></script>
</head>
<body>
    <article class="guide-contents">
        <div class="title">
			<h3>Button</h3>
		</div>
        <div class="tbl-wrap">
             <table class="tbl">
                <caption>입력 필드</caption>
                <colgroup>
                    <col width="15%" />
                    <col width="28.333%" />
                    <col width="28.333%" />
                    <col width="28.333%" />
                </colgroup>
                <thead>
                    <tr>
                        <th>구분</th>
                        <th>default</th>
                        <th>hover</th>
                        <th>disabled</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th>Primary Large</th>
                        <td>
                            <button type="button" class="btn btn-primary btn-lg">Primary Large</button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-primary btn-lg active">Primary Large hover</button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-primary btn-lg" disabled>Primary Large disabled</button>
                        </td>
                    </tr>
                    <tr> 
                        <th>Secondary Medium & Small</th>
                        <td>
                            <button type="button" class="btn btn-secondary btn-md">Secondary Medium</button>
                            <button type="button" class="btn btn-secondary btn-sm">Secondary Small</button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-secondary btn-md active">Secondary Medium hover</button>
                            <button type="button" class="btn btn-secondary btn-sm active">Secondary Small hover</button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-secondary btn-md" disabled>Secondary Medium disabled</button>
                            <button type="button" class="btn btn-secondary btn-sm" disabled>Secondary Small disabled</button>
                        </td>
                    </tr>
                    <tr>
                        <th>Outline Medium & Small</th>
                        <td>
                            <button type="button" class="btn btn-outline btn-md">Outline Medium</button>
                            <button type="button" class="btn btn-outline btn-sm">Outline Small</button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-outline btn-md active">Outline Medium hover</button>
                            <button type="button" class="btn btn-outline btn-sm active">Outline Small hover</button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-outline btn-md" disabled>Outline Medium disabled</button>
                            <button type="button" class="btn btn-outline btn-sm" disabled>Outline Small disabled</button>
                        </td>
                    </tr>
                    <tr>
                        <th>Grid</th>
                        <td>
                            <button type="button" class="btn btn-grid btn-xxsm">Grid</button>    
                        </td>
                        <td>
                            <button type="button" class="btn btn-grid btn-xxsm active">Grid</button>
                        </td>
                        <td><button type="button" class="btn btn-grid btn-xxsm" disabled>Grid</button></td>
                    </tr>
                    <tr>
                        <th>Outline Round</th>
                        <td>
                            <button class="btn btn-outline--round btn-xsm">1개월</button>
                        </td>
                        <td>
                            <button class="btn btn-outline--round btn-xsm active">3개월</button>
                        </td>
                        <td><button class="btn btn-outline--round btn-xsm" disabled>12개월</button></td>
                    </tr>
                    <tr>
                        <th>Icon</th>
                        <td>
                            <button type="button" class="btn btn-icon"><i class="icon del-trash"></i></button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-icon acitve"><i class="icon del-trash"></i></button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-icon" disabled><i class="icon del-trash"></i></button>
                        </td>
                    </tr>
                </tbody>
             </table>
        </div>
    </article>
</body>
</html>
