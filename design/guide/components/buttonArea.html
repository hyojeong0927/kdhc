<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>button area</title>
    <!-- css -->
    <link rel="stylesheet" href="../../../css/index.css">
    <!-- script -->
    <script src="../../../assets/js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../../../assets/js/vendors/bootstrap-datepicker.min.js"></script>
    <script type="module" src="../../../assets/js/common.js"></script>
</head>

<body>
    <article class="guide-contents">
        <div class="title">
            <h3>Button Area</h3>
        </div>
        <!-- grid top button 영역 -->
        <div class="grid-top-btn">
            <button type="button" class="btn btn-outline btn-sm">불용반출기안</button>
            <button type="button" class="btn btn-outline btn-sm">등록기안</button>
            <button type="button" class="btn btn-secondary btn-sm">출력</button>
        </div>
        <!--// grid top button 영역 -->

        <!-- bottom button area -->
        <div class="bottom-btn-area">
            <button type="button" class="btn btn-outline btn-md">삭제</button>
            <button type="button" class="btn btn-secondary btn-md">저장</button>
        </div>
        <!--// bottom button area -->
    </article>
</body>

</html>
